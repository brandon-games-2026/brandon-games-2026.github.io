<style>
:root{--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);--ink:#2b2140}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0}
body{font-family:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,system-ui,"Segoe UI",sans-serif;background:#9fe6a9;color:var(--ink);touch-action:none;display:flex;flex-direction:column}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#top{padding:calc(var(--top) + 8px) 14px 8px;display:flex;align-items:center;justify-content:space-between;background:#fff;box-shadow:0 3px 12px rgba(40,20,80,.12);z-index:3;gap:8px}
.gooRow{display:flex;align-items:center;gap:8px}
#goo{font-size:32px;font-weight:900;letter-spacing:-.5px;line-height:1.05;font-variant-numeric:tabular-nums}
#gps{font-size:14px;font-weight:800;color:#3fae3a;margin-left:32px}
.drop{display:inline-block;width:22px;height:22px;border-radius:50% 0 50% 50%;transform:rotate(-45deg);background:radial-gradient(circle at 40% 60%,#d4ffc4,#57d651 55%,#2e9a2c);box-shadow:inset -2px -2px 0 rgba(0,0,0,.12);flex:none}
.drop.sm{width:14px;height:14px}
.bb .drop,#buy .drop{background:radial-gradient(circle at 40% 60%,#fff,#e4ffdc 60%,#b8eeb0)}
.gr{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.badge{background:#f2ecff;border-radius:999px;padding:4px 10px;font-size:14px;font-weight:800;white-space:nowrap}
#rjb{background:#fff3c4;display:none}
#field{flex:1;position:relative;min-height:0;overflow:hidden}
#c{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;display:block}
#bottom{padding:10px 12px calc(var(--bot) + 10px);background:#fff;box-shadow:0 -3px 12px rgba(40,20,80,.12);z-index:3}
#buy{width:100%;height:64px;border-radius:20px;background:linear-gradient(#7fe86f,#45c13d);box-shadow:0 5px 0 #2f8f2a,0 8px 14px rgba(40,120,40,.3);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:900;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.18);transition:transform .06s}
#buy:active{transform:translateY(3px);box-shadow:0 2px 0 #2f8f2a}
#buy.off{background:linear-gradient(#c9d3c7,#aab5a8);box-shadow:0 5px 0 #8a948a}
#buy .bl{display:flex;flex-direction:column;align-items:flex-start;text-align:left;line-height:1.1}
#buy small{font-size:13px;font-weight:700;opacity:.92}
#buy .bc{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.16);padding:7px 12px;border-radius:14px;font-size:19px}
#nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.nb{position:relative;height:52px;border-radius:16px;background:#f2ecff;box-shadow:0 4px 0 #d3c6f5;font-weight:900;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1}
.nb:active{transform:translateY(2px);box-shadow:0 2px 0 #d3c6f5}
.nb i{font-style:normal;font-size:20px}
.dot{position:absolute;top:-5px;right:-3px;min-width:20px;height:20px;border-radius:10px;background:#ff4d6d;color:#fff;font-size:12px;line-height:20px;padding:0 5px;display:none;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.sheet{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;justify-content:flex-end;background:rgba(30,15,60,.4)}
.sheet.open{display:flex}
.panel{background:#fff;border-radius:26px 26px 0 0;max-height:84%;display:flex;flex-direction:column;padding-bottom:var(--bot);animation:up .28s cubic-bezier(.2,1.2,.4,1)}
@keyframes up{from{transform:translateY(60%)}to{transform:none}}
.ph{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 8px 20px;font-size:26px;font-weight:900}
.ph small{font-size:15px;color:#8a7fa8;font-weight:800;margin-left:8px}
.x{width:44px;height:44px;border-radius:50%;background:#f2ecff;font-size:20px;font-weight:900}
.pb{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;padding:6px 14px 18px}
.item{display:flex;align-items:center;gap:12px;background:#f8f5ff;border-radius:18px;padding:12px;margin-bottom:10px}
.ic{width:46px;height:46px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none;box-shadow:0 2px 0 #e4dcf7}
.it{flex:1;min-width:0}
.it b{display:block;font-size:16px;font-weight:900}
.it .lv{font-size:12px;background:#e7defc;border-radius:8px;padding:1px 6px;margin-left:4px;vertical-align:2px}
.it small{display:block;font-size:13px;color:#6d6390;font-weight:700;margin-top:2px}
.bb{min-width:92px;height:46px;border-radius:14px;background:linear-gradient(#7fe86f,#45c13d);box-shadow:0 4px 0 #2f8f2a;color:#fff;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 10px;text-shadow:0 1px 0 rgba(0,0,0,.2);flex:none}
.bb:active{transform:translateY(2px);box-shadow:0 2px 0 #2f8f2a}
.bb:disabled{background:#d5d0e0;box-shadow:0 4px 0 #b9b2c9;color:#fff}
.asc{background:linear-gradient(135deg,#fff3c4,#ffd6f0);border-radius:20px;padding:14px;margin-bottom:14px;text-align:center}
.asc h3{margin:0 0 4px;font-size:19px;font-weight:900}
.asc p{margin:0 0 10px;font-size:13px;font-weight:700;color:#6d5a3a}
.asc .bb{width:100%;background:linear-gradient(#b48cff,#7a4fe0);box-shadow:0 4px 0 #5532a8}
.asc .bb:disabled{background:#d5d0e0;box-shadow:0 4px 0 #b9b2c9}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:#f8f5ff;border-radius:18px;padding:8px 4px 10px;text-align:center}
.card canvas{width:84px;height:84px;display:block;margin:0 auto}
.card b{display:block;font-size:13px;font-weight:900;line-height:1.15;min-height:30px;display:flex;align-items:center;justify-content:center;padding:0 2px}
.card small{display:block;font-size:11px;color:#7a6f9a;font-weight:800}
.card.new{background:#fff6cf}
.row{display:flex;justify-content:space-between;align-items:center;background:#f8f5ff;border-radius:16px;padding:14px 16px;margin-bottom:10px;font-weight:800;font-size:16px}
.tg{width:62px;height:34px;border-radius:17px;background:#d5d0e0;position:relative;transition:background .2s}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.tg.on{background:#45c13d}.tg.on::after{left:31px}
.stats{font-size:14px;font-weight:700;color:#6d6390;line-height:1.7;padding:4px 6px 12px}
.danger{width:100%;height:52px;border-radius:16px;background:#ffe1e6;color:#d6284a;font-weight:900;font-size:16px;margin-top:6px}
.mod{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(30,15,60,.6);padding:20px}
.mod.open{display:flex}
.mbox{position:relative;background:#fff;border-radius:28px;padding:22px 20px 20px;width:100%;max-width:340px;text-align:center;animation:pop .4s cubic-bezier(.2,1.6,.4,1);overflow:hidden}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.mbox h2{margin:4px 0 6px;font-size:28px;font-weight:900}
.mbox p{margin:6px 0;font-size:16px;font-weight:700;color:#5d5380}
.mbox .big{font-size:30px;font-weight:900;color:var(--ink)}
.mbtn{width:100%;height:56px;border-radius:18px;background:linear-gradient(#7fe86f,#45c13d);box-shadow:0 5px 0 #2f8f2a;color:#fff;font-weight:900;font-size:20px;margin-top:14px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.mbtn.alt{background:#efeaf9;box-shadow:0 5px 0 #d3c6f5;color:var(--ink);text-shadow:none}
.mbtn.red{background:linear-gradient(#ff7a90,#e8405e);box-shadow:0 5px 0 #b02640}
.mbtn.pur{background:linear-gradient(#b48cff,#7a4fe0);box-shadow:0 5px 0 #5532a8}
.newtag{display:inline-block;background:linear-gradient(90deg,#ff5fa2,#ffb330);color:#fff;font-weight:900;font-size:22px;padding:6px 18px;border-radius:999px;letter-spacing:1px;transform:rotate(-3deg);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.rays{position:absolute;left:50%;top:150px;width:520px;height:520px;margin:-260px 0 0 -260px;background:repeating-conic-gradient(rgba(255,236,160,.22) 0 12deg,rgba(255,255,255,0) 12deg 24deg);-webkit-mask-image:radial-gradient(circle,#000 0,#000 25%,transparent 70%);mask-image:radial-gradient(circle,#000 0,#000 25%,transparent 70%);border-radius:50%;animation:spin 8s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
#nsc{position:relative;width:170px;height:170px;display:block;margin:6px auto 0}
.rel{position:relative}
/* ---- v2 ---- */
#top{flex-wrap:wrap;padding-bottom:6px}
.badge{cursor:pointer}
#rjb{display:none}
#sdb{background:#e3f0ff;display:none}
#frz{background:linear-gradient(90deg,#ffd23f,#ff9b3f);color:#5a2a00;display:none;animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}
#goalW{flex-basis:100%;display:flex;align-items:center;gap:8px;margin-top:6px}
#goal{flex:1;height:18px;border-radius:9px;background:#efeaf9;position:relative;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.06)}
#goalF{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:9px;background:linear-gradient(90deg,#7fe86f,#45c13d);transition:width .25s}
#goalF.gold{background:linear-gradient(90deg,#ffd23f,#ff9b3f)}
#goalT{position:absolute;inset:0;font-size:11.5px;font-weight:900;display:flex;align-items:center;justify-content:center;white-space:nowrap;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.7)}
#crowd{font-size:12px;font-weight:900;color:#7a4fe0;white-space:nowrap}
.nb i{font-size:19px}
.tabs{display:flex;gap:8px;margin:0 0 12px}
.tab{flex:1;height:42px;border-radius:14px;background:#f2ecff;font-weight:900;font-size:15px;box-shadow:0 3px 0 #d3c6f5}
.tab.on{background:linear-gradient(#b48cff,#7a4fe0);color:#fff;box-shadow:0 3px 0 #5532a8}
.reb{background:linear-gradient(135deg,#dfe9ff,#f0dcff);border-radius:20px;padding:14px;margin-bottom:14px;text-align:center}
.reb h3{margin:0 0 4px;font-size:19px;font-weight:900}.reb p{margin:0 0 10px;font-size:13px;font-weight:700;color:#4a3f7a}
.reb .bb{width:100%;background:linear-gradient(#6aa8ff,#4a5fe0);box-shadow:0 4px 0 #2f3ea8}
.bb.rj{background:linear-gradient(#ffd96a,#f0a91c);box-shadow:0 4px 0 #b47600;color:#5a3500;text-shadow:none}
.bb.rj:disabled{background:#e7e2ee;box-shadow:0 4px 0 #c9c2d6;color:#9a92ad}
.zone{font-size:12px;font-weight:800;color:#6d6390;background:#fff;border-radius:10px;padding:3px 8px;margin:4px 4px 0 0;display:inline-block}
/* races */
#track{width:100%;height:200px;display:block;border-radius:18px;background:#7fd37f}
.rstat{text-align:center;font-weight:900;font-size:17px;margin:8px 0 6px;min-height:24px}
.racer{display:flex;align-items:center;gap:10px;background:#f8f5ff;border-radius:16px;padding:8px 10px;margin-bottom:8px;border:3px solid transparent}
.racer.sel{border-color:#7a4fe0;background:#f1eaff}
.racer.mine{background:#fff6cf}
.racer canvas{width:44px;height:44px;flex:none}
.racer .it small{margin-top:0}
.odds{text-align:right;font-weight:900;font-size:17px;min-width:62px}
.odds small{display:block;font-size:11px;color:#8a7fa8;font-weight:800}
.betrow{display:flex;gap:8px;margin:6px 0 8px}
.chip{flex:1;height:44px;border-radius:14px;background:#f2ecff;font-weight:900;font-size:14px;box-shadow:0 3px 0 #d3c6f5;line-height:1.05}
.chip small{display:block;font-size:11px;font-weight:800;opacity:.75}
.chip.on{background:linear-gradient(#7fe86f,#45c13d);color:#fff;box-shadow:0 3px 0 #2f8f2a}
.rbtn{width:100%;height:52px;border-radius:16px;font-weight:900;font-size:17px;margin-top:4px;background:linear-gradient(#ff9b6a,#f0603c);box-shadow:0 4px 0 #b0381c;color:#fff}
.rbtn:disabled{background:#ddd6e6;box-shadow:0 4px 0 #c0b8cc}
.rbtn.alt{background:#fff3c4;box-shadow:0 4px 0 #e6cf7a;color:#6d4a00}
.streak{font-size:13px;font-weight:900;color:#e0602a;background:#fff0e6;border-radius:999px;padding:4px 10px;margin-left:8px}
.note{font-size:12px;color:#8a7fa8;font-weight:700;text-align:center;margin:8px 0 2px}
/* full-screen reveal */
.mod.reveal{background:radial-gradient(circle at 50% 40%,rgba(80,40,140,.9),rgba(15,5,35,.96))}
.mod.reveal .mbox{background:transparent;color:#fff;box-shadow:none;max-width:380px}
.mod.reveal .mbox h2{color:#fff;font-size:34px;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.mod.reveal .mbox p{color:#e8dcff}
.mod.reveal #nsc{width:230px;height:230px}
.flash{position:fixed;inset:0;background:#fff;z-index:25;pointer-events:none;animation:flash .7s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
.tierno{font-size:14px;font-weight:900;letter-spacing:2px;color:#ffd96a;margin-top:6px}
#fx{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:40}
#wheel{width:220px;height:220px;display:block;margin:6px auto}
</style>
</head>
<body>
<div id="top">
  <div>
    <div class="gooRow"><span class="drop"></span><span id="goo">0</span></div>
    <div id="gps">+0 goo/s</div>
  </div>
  <div class="gr">

    <div class="badge" id="penB">🏡 <b id="pen">0/8</b></div>

</div>

    <button class="nb" id="bDex"><i>📖</i>Slimedex<span class="dot" id="dexDot" style="background:#7a4fe0">1</span></button>

  </div>
</div>

<div class="sheet" id="shShop"><div class="panel"><div class="ph"><span>Shop</span><button class="x" data-close>✕</button></div><div class="pb"><div class="tabs"><button class="tab on" id="tabU">🛒 Upgrades</button><button class="tab" id="tabC">👑 Crown Shop</button></div><div id="shopList"></div></div></div></div>

<div class="sheet" id="shSet"><div class="panel"><div class="ph"><span>Settings</span><button class="x" data-close>✕</button></div><div class="pb" id="setList"></div></div></div>
<div class="mod" id="modal"><div class="mbox" id="mbox"></div></div>

// ---------- SLIME RACES (goo only, odds shown, bets capped at 25% of goo) ----------
var RACE_INT=180,RACE_MC=600,BET_FR=[0.05,0.10,0.25],HOUSE=0.92,MAXPAY=50;
var RNAMES=['Wobbles','Sir Squish','Gloopy','Turbo Goo','Mochi','Blorbo','Jellybean','Sludge Bolt','Captain Drip','Princess Ooze','Splatz','Noodle','Bubbles McGee','Goo Fighter','Slimothy','Dr. Jiggle','Puddles','Zoom Zoom','Grandma Gel','Lil Splat','Squishy Pete','Bloop'];
var STY={steady:{n:'Steady',a:1,b:1,nz:0.10},sprint:{n:'Sprinter',a:1.2,b:0.86,nz:0.16},closer:{n:'Closer',a:0.86,b:1.24,nz:0.16},wild:{n:'Wildcard',a:1,b:1,nz:0.42}},STK=['steady','sprint','closer','wild'];
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function speedOf(t,sh){return 1+0.032*t+(sh?0.07:0);}
var RC=null,rT=0,rSlow=1,rLog='',rPhoto=false,rDone=false,rRes=null,rLead=-1,rTrace=null,rFin=null,rCall='';
function dayStr(d){d=d||new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function newRace(at){
  rFin=null;rTrace=null;rRes=null;rDone=false;
  for(var tries=0;tries<6;tries++){rollRace(at);if(Math.max.apply(null,RC.p)<=0.8)break;} // no near-certain favourites: every bet keeps a house edge
  return RC;}
function rollRace(at){
  var seed=(Math.random()*2147483647)|0,r=mulberry(seed),T0=Math.max(1,Math.min(cycleCap(),S.maxRun||1)),used={},rs=[];
  for(var i=0;i<4;i++){var nm;do{nm=RNAMES[(r()*RNAMES.length)|0];}while(used[nm]);used[nm]=1;
    var t=Math.max(0,Math.min(cycleCap(),T0+Math.round(r()*6-3.5)));
    rs.push({n:nm,t:t,sh:r()<0.08?1:0,st:STK[(r()*4)|0],form:0.95+r()*0.1,own:0});}
  RC={seed:seed,rs:rs,start:at||Date.now()+RACE_INT*1000,bet:null,entry:0,state:'open',p:[0,0,0,0],odds:[1,1,1,1]};
  raceOdds();return RC;
}
// deterministic race model: returns finish times, optionally records 10 Hz traces for the animation
function runRace(rs,seed,trace){var r=mulberry(seed),pos=[0,0,0,0],fin=[0,0,0,0],seg=[1,1,1,1],t=0,dt=0.05,done=0,k,step=0;
  while(done<4&&t<40){if(step%10===0)for(k=0;k<4;k++){var st=STY[rs[k].st];seg[k]=1+(r()*2-1)*st.nz;}
    for(k=0;k<4;k++){if(fin[k])continue;var st2=STY[rs[k].st],ph=pos[k]<55?st2.a:st2.b;pos[k]+=9*speedOf(rs[k].t,rs[k].sh)*rs[k].form*ph*seg[k]*dt;if(pos[k]>=100){fin[k]=t+dt*(1-(pos[k]-100)/(9*dt));done++;pos[k]=100;}}
    t+=dt;step++;if(trace&&step%2===0)for(k=0;k<4;k++)trace[k].push(pos[k]);}
  return fin;}
function raceOdds(){var w=[0,0,0,0];for(var m=0;m<RACE_MC;m++){var f=runRace(RC.rs,RC.seed+7919*(m+1),null),b=0;for(var k=1;k<4;k++)if(f[k]<f[b])b=k;w[b]++;}
  for(k=0;k<4;k++){var p=Math.max(0.5,w[k])/RACE_MC;RC.p[k]=p;RC.odds[k]=Math.max(1.1,Math.min(MAXPAY,Math.floor(HOUSE/p*10)/10));}}
function bestSlime(){var b=null;for(var i=0;i<SL.length;i++){var s=SL[i];if(!b||s.tier>b.tier||(s.tier===b.tier&&s.sh>b.sh))b=s;}return b;}
function raceDaily(){var d=dayStr();if(S.race.lastDay===d)return 0;var y=new Date();y.setDate(y.getDate()-1);
  S.race.streak=(S.race.lastDay===dayStr(y))?S.race.streak+1:1;S.race.lastDay=d;var bonus=Math.max(200,gps()*60*Math.min(7,S.race.streak));addGoo(bonus);
  if(!SIM){addText(W/2,H*0.3,'🔥 Day '+S.race.streak+' race streak! +'+fmt(bonus),2,'#e0602a',18);sCrown();}return bonus;}
function enterOwn(){if(!RC||RC.state!=='open')return false;var b=bestSlime();if(!b)return false;
  if(RC.entry){RC.rs[3]=RC.saved;RC.entry=0;if(RC.bet&&RC.bet.i===3){refund(RC.bet.amt);RC.bet=null;}raceOdds();return true;}
  RC.saved=RC.rs[3];RC.rs[3]={n:'Your '+TIERS[b.tier].n,t:b.tier,sh:b.sh,st:'steady',form:1,own:1};RC.entry=1;S.race.entries++;raceDaily();raceOdds();
  if(RC.bet&&RC.bet.i===3){refund(RC.bet.amt);RC.bet=null;}return true;}
function betMax(){return Math.floor(S.goo*0.25);}
function placeBet(i,fr){if(!RC||RC.state!=='open'||RC.bet||(RC.entry&&i===3))return false; // can't bet on your own entry (it races for a prize)
fr=Math.min(0.25,fr);var amt=Math.floor(S.goo*fr);if(amt<1)return false;
  spend(amt);RC.bet={i:i,amt:amt,odds:RC.odds[i]};raceDaily();if(!SIM)sBuy();return true;}
function cancelBet(){if(!RC||RC.state!=='open'||!RC.bet)return false;refund(RC.bet.amt);RC.bet=null;return true;}
function refund(v){S.goo=safe(S.goo+v);}
function startRace(){if(!RC||RC.state!=='open')return false;RC.state='run';rT=-1.2;rSlow=1;rPhoto=false;rDone=false;rRes=null;rLead=-1;rCall='Ready…';
  rTrace=[[],[],[],[]];rFin=runRace(RC.rs,RC.seed,rTrace);if(!SIM){sTick(false);var rb=$('raceBody');if(rb)rb.scrollTop=0;}return true;}
// settle: pays out, never touches slimes or upgrades
function settleRace(){if(!RC||RC.state==='done')return null;if(!rFin)rFin=runRace(RC.rs,RC.seed,null);
  var ord=[0,1,2,3].sort(function(a,b){return rFin[a]-rFin[b];}),w=ord[0],res={ord:ord,win:w,payout:0,prize:0,photo:rFin[ord[1]]-rFin[w]<0.12};
  if(RC.bet||RC.entry)S.race.races++;
  if(RC.bet){if(RC.bet.i===w){res.payout=Math.floor(RC.bet.amt*RC.bet.odds);addGoo(res.payout);S.race.wins++;S.race.won+=res.payout;if(RC.bet.odds>S.race.best)S.race.best=RC.bet.odds;}else S.race.lost+=RC.bet.amt;}
  if(RC.entry){var pl=ord.indexOf(3);if(pl===0){res.prize=Math.max(500,gps()*120);S.race.champ++;}else if(pl===1)res.prize=Math.max(100,gps()*30);if(res.prize)addGoo(res.prize);}
  RC.state='done';rRes=res;return res;}
function raceTick(dt){
  if(!RC)newRace();
  if(RC.state==='open'&&Date.now()>=RC.start){
    if(!RC.bet&&!RC.entry){settleRace();newRace(RC.start+RACE_INT*1000>Date.now()?RC.start+RACE_INT*1000:Date.now()+RACE_INT*1000);return;}
    if(openSheet!=='shRace'&&!mOpen&&!SIM)open('shRace');
    if(openSheet==='shRace')startRace();
  }
  if(RC.state==='run'){
    rT+=dt*rSlow;
    var lead=0,i;for(i=1;i<4;i++)if(rPos(i)>rPos(lead))lead=i;
    if(rT>0&&rT-dt*rSlow<=0){rCall='And they\'re off! 🏁';sGun();}
    if(rT>1&&lead!==rLead){if(rLead>=0)rCall=RC.rs[lead].n+' takes the lead!';rLead=lead;}
    var ord=[0,1,2,3].sort(function(a,b){return rFin[a]-rFin[b];});
    var lastAtHalf=rTrace[ord[0]][Math.floor(rTrace[0].length*0.45)]<=Math.min(rTrace[0][Math.floor(rTrace[0].length*0.45)],rTrace[1][Math.floor(rTrace[1].length*0.45)],rTrace[2][Math.floor(rTrace[2].length*0.45)],rTrace[3][Math.floor(rTrace[3].length*0.45)])+0.01;
    if(rT>rFin[ord[0]]*0.7&&lastAtHalf&&rCall.indexOf('COMEBACK')<0){rCall='COMEBACK! '+RC.rs[ord[0]].n+' surges from the back! 🚀';}
    if(rFin[ord[1]]-rFin[ord[0]]<0.12&&rT>rFin[ord[0]]-0.6&&!rPhoto){rPhoto=true;rSlow=0.25;rCall='📸 PHOTO FINISH…';}
    if(rT>=rFin[ord[0]]&&!rDone){rDone=true;rSlow=1;var res=settleRace();announce(res);}
    if(rDone&&rT>rFin[ord[3]]+2.5){newRace();if(openSheet==='shRace')buildRace();}
  }
}
function rPos(k){if(!rTrace||rT<=0)return 0;var a=rTrace[k],f=rT*10,i=Math.floor(f);if(i>=a.length-1)return a.length?a[a.length-1]:0;return a[i]+(a[i+1]-a[i])*(f-i);}
function announce(res){var w=RC.rs[res.win];rCall=(res.photo?'📸 By a nose! ':'')+w.n+' wins!';
  if(SIM)return;
  if(res.payout>0){rCall+=' You won +'+fmt(res.payout)+' 🎉';sWin();fxCoins(Math.min(150,40+Math.floor(RC.bet.odds*8)));fxConfetti(50);}
  else if(RC.bet){rCall+=' Better luck next time!';sLose();}
  if(res.prize){rCall+=(res.win===3?' 🏆 Your slime is CHAMPION! +':' 🥈 Your slime placed 2nd! +')+fmt(res.prize);if(res.win===3){fxConfetti(80);sWin();}}
  if(openSheet==='shRace')buildRace(true);}

var trk=$('track'),tg=trk.getContext('2d'),trkW=0;
function drawTrack(){if(!RC)return;var w=trk.clientWidth||300,h=200,d=Math.min(3,window.devicePixelRatio||1);if(trkW!==w){trkW=w;trk.width=Math.round(w*d);trk.height=Math.round(h*d);}
  var g=tg;g.setTransform(d,0,0,d,0,0);g.fillStyle='#7fd37f';g.fillRect(0,0,w,h);var lh=(h-20)/4,x0=34,x1=w-30;
  for(var k=0;k<4;k++){var y=10+k*lh;g.fillStyle=k%2?'#d9b98a':'#e6c899';g.fillRect(0,y,w,lh-2);}
  for(var q=0;q<8;q++){g.fillStyle=q%2?'#fff':'#2b2140';g.fillRect(x1,10+q*(h-20)/8,8,(h-20)/8);}
  g.fillStyle='rgba(255,255,255,.8)';g.fillRect(x0-2,10,3,h-20);

    var c=sprite(rr2.t,rr2.sh,0),sc=(lh*0.95)/(rad(rr2.t)*2.4);g.save();g.translate(x,yb-z);g.scale(sc,sc);g.drawImage(c,-c.ox,-c.oy,c.cw,c.ch);g.restore();
    g.font='800 10px ui-rounded,-apple-system,system-ui,sans-serif';g.textAlign='left';g.textBaseline='middle';g.fillStyle=rr2.own?'#b05a00':'rgba(43,33,64,.75)';g.fillText((k+1)+' '+rr2.n,4,10+k*lh+9);
    if(rDone&&rRes){var pl=rRes.ord.indexOf(k);g.font='900 15px ui-rounded,system-ui';g.fillStyle=pl===0?'#e0a000':'#2b2140';g.textAlign='right';g.fillText(['🥇','🥈','🥉','4th'][pl],w-42,10+k*lh+lh/2);}}
  if(rPhoto&&!rDone){g.fillStyle='rgba(255,255,255,'+(0.3+0.3*Math.sin(T*20))+')';g.fillRect(x1-40,10,40,h-20);}
  if(RC.state==='run'&&rT<0){g.fillStyle='rgba(43,33,64,.7)';g.fillRect(0,0,w,h);g.fillStyle='#fff';g.font='900 54px ui-rounded,system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(rT<-0.8?'3':rT<-0.4?'2':'1',w/2,h/2);}
}

  if(document.hidden){save();stopLoop();}          // fully paused while hidden: no rAF, no work

try{var ic=document.createElement('canvas');ic.width=ic.height=180;var ig=ic.getContext('2d');var bg=ig.createLinearGradient(0,0,0,180);bg.addColorStop(0,'#d6fadb');bg.addColorStop(1,'#86dc92');ig.fillStyle=bg;ig.fillRect(0,0,180,180);drawSlime(ig,90,150,62,0,{t:0});$('ati').href=ic.toDataURL('image/png');}catch(e){}
// ---------- headless pacing bot: plays an "active player" and records milestone times ----------
var CR_PRI=['start','keep','amf','estate','jar','jelly','keep','luck','hatch','dream'];
function simPlay(hours,opt){opt=opt||{};
  var bk={S:S,SL:SL,fr:frenzyT,T:T,RC:RC},out={tiers:{},asc:[],reb:[],log:[]};
  SIM=true;S=fresh();SL=[];spawnSlime(0,false,0);spawnSlime(0,false,0);frenzyT=0;autoAcc=amAcc=hatAcc=0;goldT=90;
  var dt=opt.dt||1,end=hours*3600,lastNew=0,tapR=opt.taps===undefined?1:opt.taps,mergeR=opt.merges===undefined?0.5:opt.merges,mAcc=0,lastAscT=0;
  try{
  for(var t=0;t<end;t+=dt){
    var mx=S.maxRun;tickEco(dt);
    // manual taps on the best slime and manual merges
    if(tapR&&SL.length){var b=SL[0];for(var i=1;i<SL.length;i++)if(SL[i].tier>b.tier)b=SL[i];for(var q=0;q<tapR*dt;q++)squish(b);}
    mAcc+=mergeR*dt;while(mAcc>=1){mAcc--;if(!simMergeOne())break;}
    // zones: best slimes go into the ×goo zones
    if((t|0)%10===0){var srt=SL.slice().sort(function(a,b){return b.tier-a.tier||b.sh-a.sh;}),pm=penMax(),c0=0,c2=0;
      for(i=0;i<srt.length;i++){var s=srt[i];s.zn=-1;if(zoneOn(2,pm)&&c2<ZCAP){s.zn=2;c2++;}else if(zoneOn(0,pm)&&c0<ZCAP){s.zn=0;c0++;}else if(zoneOn(1,pm))s.zn=1;}}
    // buy: cheapest affordable thing first
    for(var guard=0;guard<30;guard++){var best=null,bc=Infinity;
      UPS.forEach(function(u){var l=lvl(u.k);if(l>=u.mx())return;if(u.k==='sq'&&l>lvl('mult')+3)return;var c=u.cost(l);if(c<bc){bc=c;best=u.k;}});
      var sc=buyCost();if(SL.length<penMax()&&sc<bc){bc=sc;best='$';}
      if(!best||S.goo<bc)break;if(best==='$')buySlime();else buyUp(best);}
    if(opt.trace&&(t%opt.trace)<dt)out.log.push((t|0)+'s goo '+fmt(S.goo)+' gps '+fmt(gps())+' up '+JSON.stringify(S.up)+' b '+S.bought+' sl '+SL.map(function(s){return s.tier+(s.sh?'*':'');}).join(','));
    if(S.maxRun>mx)lastNew=t;
    for(var k=mx+1;k<=S.maxRun;k++)if(out.tiers[k]===undefined)out.tiers[k]=+(t/3600).toFixed(2);
    if(canRebirth()){out.reb.push(+(t/3600).toFixed(2));out.log.push('reb '+S.reb+' sd+'+sdGain()+' @'+(t/3600).toFixed(2)+'h');rebirth();lastNew=t;lastAscT=t;}
    else if(canAscend()){var g=rjGain(),since=t-lastAscT;
      if(g>=Math.max(3,S.rjCycle*0.5)||(t-lastNew>900&&since>900)){out.asc.push(+(t/3600).toFixed(2));out.log.push('asc '+(S.asc+1)+' +'+g+' rj (cyc '+(S.rjCycle+g)+', tier '+S.maxRun+') @'+(t/3600).toFixed(2)+'h');ascend();lastNew=t;lastAscT=t;
        for(var z=0;z<40;z++){var bb=null,bcst=Infinity;CR.forEach(function(u){var l=cl(u.k);if(l>=u.max)return;var c=u.cost(l)*(CR_PRI.indexOf(u.k)<0?3:1+CR_PRI.indexOf(u.k)*0.15);if(c<bcst){bcst=c;bb=u;}});if(!bb||S.rj<bb.cost(cl(bb.k)))break;buyCrown(bb.k);}}}
    if(S.best>=MAXT&&opt.stopAtEnd!==false){out.end=+(t/3600).toFixed(2);break;}
  }
  out.final={best:S.best,maxRun:S.maxRun,asc:S.asc,reb:S.reb,sd:S.sd,rj:S.rj,rjCycle:S.rjCycle,cr:JSON.parse(JSON.stringify(S.cr)),gps:gps(),pen:penMax(),n:SL.length,shinies:S.shinies};
  }finally{SIM=false;S=bk.S;SL=bk.SL;frenzyT=bk.fr;T=bk.T;RC=bk.RC;}
  return out;}
window.__sf={get S(){return S;},set S(v){S=v;},get SL(){return SL;},get RC(){return RC;},TIERS:TIERS,UPS:UPS,CR:CR,Z:Z,

  rjGain:rjGain,sdGain:sdGain,buyCost:buyCost,fmt:fmt,squish:squish,spawn:spawnSlime,crowdMult:crowdMult,penMax:function(){return penMax();},zoneOn:zoneOn,ZR:ZR,placeZoned:placeZoned,
  newRace:newRace,placeBet:placeBet,cancelBet:cancelBet,enterOwn:enterOwn,startRace:startRace,settleRace:settleRace,raceOdds:raceOdds,betMax:betMax,raceDaily:raceDaily,
