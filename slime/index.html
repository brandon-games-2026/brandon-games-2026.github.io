<!DOCTYPE html>

<style>
:root{--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);--ink:#2b2140}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0}
body{font-family:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,system-ui,"Segoe UI",sans-serif;background:#9fe6a9;color:var(--ink);touch-action:none;display:flex;flex-direction:column}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#top{padding:calc(var(--top) + 8px) 14px 8px;display:flex;align-items:center;justify-content:space-between;background:#fff;box-shadow:0 3px 12px rgba(40,20,80,.12);z-index:3;gap:8px}
.gooRow{display:flex;align-items:center;gap:8px}
#goo{font-size:32px;font-weight:900;letter-spacing:-.5px;line-height:1.05;font-variant-numeric:tabular-nums}
#gps{font-size:14px;font-weight:800;color:#3fae3a;margin-left:32px}
.drop{display:inline-block;width:22px;height:22px;border-radius:50% 0 50% 50%;transform:rotate(-45deg);background:radial-gradient(circle at 40% 60%,#d4ffc4,#57d651 55%,#2e9a2c);box-shadow:inset -2px -2px 0 rgba(0,0,0,.12);flex:none}
.drop.sm{width:14px;height:14px}
.bb .drop,#buy .drop{background:radial-gradient(circle at 40% 60%,#fff,#e4ffdc 60%,#b8eeb0)}
.gr{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.badge{background:#f2ecff;border-radius:999px;padding:4px 10px;font-size:14px;font-weight:800;white-space:nowrap}
#rjb{background:#fff3c4;display:none}
#field{flex:1;position:relative;min-height:0;overflow:hidden}
#c{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;display:block}
#bottom{padding:10px 12px calc(var(--bot) + 10px);background:#fff;box-shadow:0 -3px 12px rgba(40,20,80,.12);z-index:3}
#buy{width:100%;height:64px;border-radius:20px;background:linear-gradient(#7fe86f,#45c13d);box-shadow:0 5px 0 #2f8f2a,0 8px 14px rgba(40,120,40,.3);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:900;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.18);transition:transform .06s}
#buy:active{transform:translateY(3px);box-shadow:0 2px 0 #2f8f2a}
#buy.off{background:linear-gradient(#c9d3c7,#aab5a8);box-shadow:0 5px 0 #8a948a}
#buy .bl{display:flex;flex-direction:column;align-items:flex-start;text-align:left;line-height:1.1}
#buy small{font-size:13px;font-weight:700;opacity:.92}
#buy .bc{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.16);padding:7px 12px;border-radius:14px;font-size:19px}
#nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.nb{position:relative;height:54px;border-radius:16px;background:#f2ecff;box-shadow:0 4px 0 #d3c6f5;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.nb:active{transform:translateY(2px);box-shadow:0 2px 0 #d3c6f5}
.nb i{font-style:normal;font-size:20px}
.dot{position:absolute;top:-5px;right:-3px;min-width:20px;height:20px;border-radius:10px;background:#ff4d6d;color:#fff;font-size:12px;line-height:20px;padding:0 5px;display:none;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.sheet{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;justify-content:flex-end;background:rgba(30,15,60,.4)}
.sheet.open{display:flex}
.panel{background:#fff;border-radius:26px 26px 0 0;max-height:84%;display:flex;flex-direction:column;padding-bottom:var(--bot);animation:up .28s cubic-bezier(.2,1.2,.4,1)}
@keyframes up{from{transform:translateY(60%)}to{transform:none}}
.ph{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 8px 20px;font-size:26px;font-weight:900}
.ph small{font-size:15px;color:#8a7fa8;font-weight:800;margin-left:8px}
.x{width:44px;height:44px;border-radius:50%;background:#f2ecff;font-size:20px;font-weight:900}
.pb{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;padding:6px 14px 18px}
.item{display:flex;align-items:center;gap:12px;background:#f8f5ff;border-radius:18px;padding:12px;margin-bottom:10px}
.ic{width:46px;height:46px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none;box-shadow:0 2px 0 #e4dcf7}
.it{flex:1;min-width:0}
.it b{display:block;font-size:16px;font-weight:900}
.it .lv{font-size:12px;background:#e7defc;border-radius:8px;padding:1px 6px;margin-left:4px;vertical-align:2px}
.it small{display:block;font-size:13px;color:#6d6390;font-weight:700;margin-top:2px}
.bb{min-width:92px;height:46px;border-radius:14px;background:linear-gradient(#7fe86f,#45c13d);box-shadow:0 4px 0 #2f8f2a;color:#fff;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 10px;text-shadow:0 1px 0 rgba(0,0,0,.2);flex:none}
.bb:active{transform:translateY(2px);box-shadow:0 2px 0 #2f8f2a}
.bb:disabled{background:#d5d0e0;box-shadow:0 4px 0 #b9b2c9;color:#fff}
.asc{background:linear-gradient(135deg,#fff3c4,#ffd6f0);border-radius:20px;padding:14px;margin-bottom:14px;text-align:center}
.asc h3{margin:0 0 4px;font-size:19px;font-weight:900}
.asc p{margin:0 0 10px;font-size:13px;font-weight:700;color:#6d5a3a}
.asc .bb{width:100%;background:linear-gradient(#b48cff,#7a4fe0);box-shadow:0 4px 0 #5532a8}
.asc .bb:disabled{background:#d5d0e0;box-shadow:0 4px 0 #b9b2c9}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:#f8f5ff;border-radius:18px;padding:8px 4px 10px;text-align:center}
.card canvas{width:84px;height:84px;display:block;margin:0 auto}
.card b{display:block;font-size:13px;font-weight:900;line-height:1.15;min-height:30px;display:flex;align-items:center;justify-content:center;padding:0 2px}
.card small{display:block;font-size:11px;color:#7a6f9a;font-weight:800}
.card.new{background:#fff6cf}
.row{display:flex;justify-content:space-between;align-items:center;background:#f8f5ff;border-radius:16px;padding:14px 16px;margin-bottom:10px;font-weight:800;font-size:16px}
.tg{width:62px;height:34px;border-radius:17px;background:#d5d0e0;position:relative;transition:background .2s}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.tg.on{background:#45c13d}.tg.on::after{left:31px}
.stats{font-size:14px;font-weight:700;color:#6d6390;line-height:1.7;padding:4px 6px 12px}
.danger{width:100%;height:52px;border-radius:16px;background:#ffe1e6;color:#d6284a;font-weight:900;font-size:16px;margin-top:6px}
.mod{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(30,15,60,.6);padding:20px}
.mod.open{display:flex}
.mbox{position:relative;background:#fff;border-radius:28px;padding:22px 20px 20px;width:100%;max-width:340px;text-align:center;animation:pop .4s cubic-bezier(.2,1.6,.4,1);overflow:hidden}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.mbox h2{margin:4px 0 6px;font-size:28px;font-weight:900}
.mbox p{margin:6px 0;font-size:16px;font-weight:700;color:#5d5380}
.mbox .big{font-size:30px;font-weight:900;color:var(--ink)}
.mbtn{width:100%;height:56px;border-radius:18px;background:linear-gradient(#7fe86f,#45c13d);box-shadow:0 5px 0 #2f8f2a;color:#fff;font-weight:900;font-size:20px;margin-top:14px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.mbtn.alt{background:#efeaf9;box-shadow:0 5px 0 #d3c6f5;color:var(--ink);text-shadow:none}
.mbtn.red{background:linear-gradient(#ff7a90,#e8405e);box-shadow:0 5px 0 #b02640}
.mbtn.pur{background:linear-gradient(#b48cff,#7a4fe0);box-shadow:0 5px 0 #5532a8}
.newtag{display:inline-block;background:linear-gradient(90deg,#ff5fa2,#ffb330);color:#fff;font-weight:900;font-size:22px;padding:6px 18px;border-radius:999px;letter-spacing:1px;transform:rotate(-3deg);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.rays{position:absolute;left:50%;top:150px;width:520px;height:520px;margin:-260px 0 0 -260px;background:repeating-conic-gradient(rgba(255,214,90,.35) 0 12deg,rgba(255,255,255,0) 12deg 24deg);border-radius:50%;animation:spin 8s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
#nsc{position:relative;width:170px;height:170px;display:block;margin:6px auto 0}
.rel{position:relative}
</style>
</head>
<body>
<div id="top">
  <div>
    <div class="gooRow"><span class="drop"></span><span id="goo">0</span></div>
    <div id="gps">+0 goo/s</div>
  </div>
  <div class="gr">
    <div class="badge" id="rjb">👑 <b id="rj">0</b> Royal Jelly</div>
    <div class="badge">🏡 <b id="pen">0/8</b></div>
  </div>
</div>
<div id="field"><canvas id="c"></canvas></div>
<div id="bottom">
  <button id="buy"><span class="bl"><span id="buyName">Buy Green Blob</span><small id="buySub">Tap to adopt a slime</small></span><span class="bc"><span class="drop sm"></span><span id="buyCost">10</span></span></button>
  <div id="nav">
    <button class="nb" id="bShop"><i>🛒</i>Shop<span class="dot" id="shopDot">!</span></button>
    <button class="nb" id="bDex"><i>📖</i>Slimedex<span class="dot" id="dexDot" style="background:#7a4fe0">1</span></button>
    <button class="nb" id="bSet"><i>⚙️</i>Settings</button>
  </div>
</div>

<div class="sheet" id="shShop"><div class="panel"><div class="ph"><span>Shop</span><button class="x" data-close>✕</button></div><div class="pb" id="shopList"></div></div></div>
<div class="sheet" id="shDex"><div class="panel"><div class="ph"><span>Slimedex<small id="dexCount"></small></span><button class="x" data-close>✕</button></div><div class="pb"><div class="grid" id="dexGrid"></div></div></div></div>
<div class="sheet" id="shSet"><div class="panel"><div class="ph"><span>Settings</span><button class="x" data-close>✕</button></div><div class="pb" id="setList"></div></div></div>
<div class="mod" id="modal"><div class="mbox" id="mbox"></div></div>

<script>
(function(){
'use strict';
var KEY='slimefarm_v1';
var TIERS=[
 {n:'Green Blob',c:'#7be36b',d:'#35a332',f:'',t:'The classic. Smells faintly of lime.'},
 {n:'Blue Jelly',c:'#62bcff',d:'#2a78d0',f:'drop',t:'Wobbles at the slightest breeze.'},
 {n:'Pink Bubblegum',c:'#ff93d0',d:'#de4f9b',f:'bubble',t:'Blows a bubble when nervous.'},
 {n:'Sunny Lemon',c:'#ffe55c',d:'#e0a913',f:'leaf',t:'Sour outside, sweet inside.'},
 {n:'Lava Slime',c:'#ff6f3f',d:'#b8231a',f:'flame',t:'Hot to the touch. Do not hug.'},
 {n:'Ice Slime',c:'#c4f4ff',d:'#5fb8de',f:'ice',t:'Keeps your drinks cold.'},
 {n:'Toxic Slime',c:'#b8ff3d',d:'#5f9e08',f:'bubbles',t:'Glows in the dark. Probably fine.'},
 {n:'Crystal Slime',c:'#dcb0ff',d:'#9358dc',f:'crystal',t:'Sparkles with every squish.'},
 {n:'Ghost Slime',c:'#f6f3ff',d:'#aaa0d6',f:'ghost',t:'Boo! ...sorry, too much?'},
 {n:'Robo Slime',c:'#c3cede',d:'#66758c',f:'robo',t:'Beep boop. Goo output: optimal.'},
 {n:'Galaxy Slime',c:'#6a3fc4',d:'#1d0f4a',f:'stars',t:'Contains at least three nebulae.'},
 {n:'Golden Slime',c:'#ffd84a',d:'#c18a06',f:'gold',t:'Worth its weight in goo.'},
 {n:'Rainbow Slime',c:'#ff7b7b',d:'#7a4fe0',f:'rainbow',t:'Every color, all at once.'},
 {n:'King Slime',c:'#9a6bff',d:'#4626a8',f:'crown',t:'All hail the squishy monarch.'},
 {n:'Cosmic Overlord',c:'#3a2766',d:'#07030f',f:'cosmic',t:'The final form. It sees everything.'}
];
var MAXT=TIERS.length-1, ASC_TIER=8;
var SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','UDc','DDc','TDc','QaDc'];
function fmt(n){
  if(!isFinite(n))return '∞';
  if(n<1000){ if(n<10&&n%1>0.05) return n.toFixed(1); return String(Math.floor(n)); }
  var e=Math.floor(Math.log10(n)/3);
  if(e>=SUF.length) return n.toExponential(2).replace('+','');
  var v=n/Math.pow(1000,e);
  return (v<10?(Math.floor(v*100)/100).toFixed(2):v<100?(Math.floor(v*10)/10).toFixed(1):Math.floor(v))+SUF[e];
}
function fmtTime(s){s=Math.floor(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+'h '+m+'m':m?m+'m '+x+'s':x+'s';}
function hex(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function mix(a,b,k){var A=hex(a),B=hex(b);return 'rgb('+A.map(function(v,i){return Math.round(v+(B[i]-v)*k);}).join(',')+')';}
TIERS.forEach(function(t){t.l=mix(t.c,'#ffffff',0.55);t.o=mix(t.d,'#000000',0.35);});
var DARK={stars:1,cosmic:1};

var $=function(id){return document.getElementById(id);};
var cv=$('c'),ctx=cv.getContext('2d'),field=$('field');
var W=320,H=420,DPR=1,baseR=28,bgCv=document.createElement('canvas');

function fresh(){return{goo:0,total:0,run:0,rj:0,asc:0,up:{sq:0,mult:0,pen:0,spawn:0,auto:0,hat:0,am:0},bought:0,slimes:[0,0],disc:[true],seen:[true],maxRun:0,tut:0,sound:true,vib:true,last:Date.now(),squishes:0,merges:0,best:0};}
var S=fresh(),SL=[],parts=[],texts=[],rings=[],drops=[],nid=1,order=[];
var autoAcc=0,amAcc=0,hatAcc=0,dropT=45,shake=0,T=0,lastAutoSnd=0;
var drag=null;

// ---------- economy ----------
var UPS=[
 {k:'sq',n:'Squish Power',i:'👆',max:200,cost:function(l){return 20*Math.pow(1.75,l);},d:function(l){return 'Squishes give ×'+fmt(sqMult(l))+(l<this.max?' → ×'+fmt(sqMult(l+1)):'');}},
 {k:'mult',n:'Goo Boost',i:'💧',max:200,cost:function(l){return 50*Math.pow(2.25,l);},d:function(l){return 'All goo/sec ×'+fmt2(gooMult(l))+' → ×'+fmt2(gooMult(l+1));}},
 {k:'pen',n:'Bigger Pen',i:'🏡',max:16,cost:function(l){return 150*Math.pow(3.2,l);},d:function(l){return 'Room for '+penMax(l)+(l<this.max?' → '+penMax(l+1):'')+' slimes';}},
 {k:'spawn',n:'Better Breeding',i:'🥚',max:9,cost:function(l){return 500*Math.pow(22,l);},d:function(l){return 'Adopt: '+TIERS[l].n+(l<this.max?' → '+(S.disc[l+1]?TIERS[l+1].n:'???'):'');}},
 {k:'auto',n:'Auto-Squisher',i:'🤖',max:20,cost:function(l){return 300*Math.pow(2.1,l);},d:function(l){return (l?autoRate(l)+' squishes/s':'Squishes slimes for you')+(l<this.max?' → '+autoRate(l+1)+'/s':'');}},
 {k:'hat',n:'Slime Hatchery',i:'🐣',max:12,cost:function(l){return 2000*Math.pow(4,l);},d:function(l){return (l?'Free slime every '+hatInt(l).toFixed(1)+'s':'Hatches free slimes over time')+(l<this.max?' → '+hatInt(l+1).toFixed(1)+'s':'');}},
 {k:'am',n:'Auto-Merge',i:'🧲',max:6,cost:function(l){return 5000*Math.pow(5,l);},d:function(l){return (l?'Merges twins every '+amInt(l).toFixed(1)+'s':'Merges matching slimes for you')+(l<this.max?' → '+amInt(l+1).toFixed(1)+'s':'');}}
];
function fmt2(n){return n<100?n.toFixed(2).replace(/\.?0+$/,''):fmt(n);}
function lvl(k){return S.up[k]||0;}
function sqMult(l){if(l===undefined)l=lvl('sq');return 1+l*0.5;}
function gooMult(l){if(l===undefined)l=lvl('mult');return Math.pow(1.2,l);}
function rjMult(){return 1+0.1*S.rj;}
function penMax(l){if(l===undefined)l=lvl('pen');return 8+l;}
function autoRate(l){if(l===undefined)l=lvl('auto');return Math.round(l*0.3*10)/10;}
function amInt(l){if(l===undefined)l=lvl('am');return l<=0?Infinity:3*Math.pow(0.68,l-1);}
function hatInt(l){if(l===undefined)l=lvl('hat');return l<=0?Infinity:30*Math.pow(0.85,l-1);}
function tierGps(t){return Math.pow(2.5,t);}
function gps(){var s=0;for(var i=0;i<SL.length;i++)s+=tierGps(SL[i].tier);return s*gooMult()*rjMult();}
function squishVal(t){return tierGps(t)*sqMult()*rjMult();}
function buyCost(){return 10*Math.pow(2.6,lvl('spawn'))*Math.pow(1.15,S.bought);}
function rjGain(){return Math.floor(Math.sqrt(S.run/1e6));}
function addGoo(v){S.goo+=v;S.total+=v;S.run+=v;}

// ---------- slimes ----------
function rad(t){return baseR*(1+t*0.045);}
function bounds(s){var r=rad(s.tier);return{x0:r+4,x1:W-r-4,y0:Math.min(H-6,30+r*1.7),y1:H-6};}
function mk(tier,x,y,z){return{id:nid++,tier:tier,x:x,y:y,z:z||0,vz:0,vx:0,vy:0,hop:0,hopDur:.42,hopH:0,idle:Math.random()*2+.5,s:0,sv:0,ph:Math.random()*6.28,blink:Math.random()*3+1,bl:0,dir:1,age:5,seek:null,lean:0,dragging:false};}
function randPos(t){var r=rad(t);return{x:r+8+Math.random()*Math.max(1,W-2*r-16),y:Math.min(H-8,40+r*1.7)+Math.random()*Math.max(1,H-8-(40+r*1.7))};}
function spawnSlime(t,sky){
  if(SL.length>=penMax())return null;
  var p=randPos(t),s=mk(t,p.x,p.y,sky?H*0.7+Math.random()*80:0);
  s.age=sky?5:0;SL.push(s);discover(t);return s;
}
function discover(t){
  if(t>S.maxRun)S.maxRun=t;
  if(t>S.best)S.best=t;
  if(!S.disc[t]){
    S.disc[t]=true;
    var bonus=tierGps(t)*10*gooMult()*rjMult();addGoo(bonus);
    sNew();buzz([20,40,30]);
    queueModal(function(){newSlimeModal(t,bonus);});
  }
}
function squish(s,auto){
  s.s=auto?0.3:0.45;s.sv=0;
  var v=squishVal(s.tier);addGoo(v);S.squishes++;
  var cy=s.y-s.z-rad(s.tier)*0.9;
  texts.push({x:s.x,y:cy-rad(s.tier)*0.6,txt:'+'+fmt(v),life:1,col:TIERS[s.tier].d,sz:auto?15:20});
  burst(s.x,cy,TIERS[s.tier].c,auto?4:9,auto?180:260);
  if(auto){if(T-lastAutoSnd>0.18){lastAutoSnd=T;sPop(s.tier,0.35);}}
  else{sPop(s.tier,1);buzz(8);}
  if(S.tut===0&&!auto)S.tut=1;
}
function burst(x,y,col,n,sp){
  for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,v=sp*(0.4+Math.random()*0.8);
    parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*0.5,life:0.5+Math.random()*0.5,max:1,r:3+Math.random()*5,col:col});}
}
function doMerge(a,b){
  if(a.tier!==b.tier||a.tier>=MAXT)return false;
  SL=SL.filter(function(s){return s!==a&&s!==b;});
  var n=mk(a.tier+1,b.x,b.y,0);n.age=0;n.s=-0.25;SL.push(n);
  var r=rad(n.tier),cy=n.y-r*0.9;

// ---------- tick ----------
function tick(dt){
  T+=dt;
  addGoo(gps()*dt);
  if(lvl('auto')>0&&SL.length){autoAcc+=dt*autoRate();var n=0;while(autoAcc>=1&&n<20){autoAcc-=1;n++;squish(SL[Math.floor(Math.random()*SL.length)],true);}if(autoAcc>1)autoAcc=1;}
  if(lvl('am')>0){amAcc+=dt;if(amAcc>=amInt()){amAcc=0;tryAutoMerge();}}
  if(lvl('hat')>0&&SL.length<penMax()){hatAcc+=dt;if(hatAcc>=hatInt()){hatAcc=0;var hs=spawnSlime(lvl('spawn'),true);}}
  dropT-=dt;if(dropT<=0){dropT=50+Math.random()*50;if(drops.length<1)drops.push({x:40+Math.random()*(W-80),y:H*0.35+Math.random()*H*0.5,z:H,vz:0,life:12});}
  physics(dt);

function physics(dt){
  var merges=[];
  for(var i=0;i<SL.length;i++){
    var s=SL[i],r=rad(s.tier),b=bounds(s);
    s.age+=dt;
    s.blink-=dt;if(s.blink<=0){s.bl=0.13;s.blink=2+Math.random()*4;}if(s.bl>0)s.bl-=dt;
    s.sv+=(-300*s.s-11*s.sv)*dt;s.s+=s.sv*dt;
    s.lean*=Math.pow(0.002,dt);
    if(s.dragging){s.z+=(16-s.z)*Math.min(1,dt*20);continue;}
    if(s.seek){
      var o=s.seek;if(SL.indexOf(o)<0||o.dragging){s.seek=null;}
      else{var dx=o.x-s.x,dy=o.y-s.y,d=Math.hypot(dx,dy),sp=520*dt;
        s.z=Math.max(s.z,10);s.lean=Math.max(-.3,Math.min(.3,dx*0.004));
        if(d<=sp+r*0.3){merges.push([s,o]);continue;}
        s.x+=dx/d*sp;s.y+=dy/d*sp;continue;}
    }
    if(s.z>0||s.vz!==0){
      if(s.hop>0){s.hop+=dt;var p=s.hop/s.hopDur;s.x+=s.vx*dt;s.y+=s.vy*dt;s.z=Math.sin(Math.PI*Math.min(1,p))*s.hopH;
        if(p>=1){s.hop=0;s.z=0;s.vz=0;s.s=0.22;s.sv=0;}}
      else{s.vz-=2000*dt;s.z+=s.vz*dt;if(s.z<=0){if(s.vz<-250){s.s=Math.min(0.45,-s.vz/2200);s.sv=0;burst(s.x,s.y-4,TIERS[s.tier].c,5,150);}s.z=0;s.vz=0;}}
    }else{
      s.idle-=dt;
      if(s.idle<=0){var a=Math.random()*Math.PI*2,dist=20+Math.random()*50;
        var tx=Math.max(b.x0,Math.min(b.x1,s.x+Math.cos(a)*dist)),ty=Math.max(b.y0,Math.min(b.y1,s.y+Math.sin(a)*dist*0.6));
        s.hopDur=0.38+Math.random()*0.12;s.vx=(tx-s.x)/s.hopDur;s.vy=(ty-s.y)/s.hopDur;s.hopH=10+Math.random()*12;s.hop=0.0001;s.z=0.01;
        s.dir=tx>s.x?1:-1;s.s=-0.12;s.idle=1.2+Math.random()*3;}
    }
  }
  // separation
  for(i=0;i<SL.length;i++)for(var j=i+1;j<SL.length;j++){
    var A=SL[i],B=SL[j];if(A.dragging||B.dragging||A.seek===B||B.seek===A)continue;

    if(d2<m&&d2>0.01){var push=(m-d2)*0.5*Math.min(1,dt*8);A.x-=dx2/d2*push;B.x+=dx2/d2*push;A.y-=dy2/d2*push*0.6;B.y+=dy2/d2*push*0.6;}
    else if(d2<=0.01){A.x-=1;B.x+=1;}
  }
  for(i=0;i<SL.length;i++){var q=SL[i];if(q.dragging)continue;var bb=bounds(q);q.x=Math.max(bb.x0,Math.min(bb.x1,q.x));q.y=Math.max(bb.y0,Math.min(bb.y1,q.y));}
  merges.forEach(function(m){if(SL.indexOf(m[0])>=0&&SL.indexOf(m[1])>=0)doMerge(m[0],m[1]);});
  for(i=parts.length-1;i>=0;i--){var P=parts[i];P.life-=dt;if(P.life<=0){parts.splice(i,1);continue;}P.vy+=900*dt;P.x+=P.vx*dt;P.y+=P.vy*dt;}
  for(i=texts.length-1;i>=0;i--){var X=texts[i];X.life-=dt;X.y-=55*dt;if(X.life<=0)texts.splice(i,1);}
  for(i=rings.length-1;i>=0;i--){var R0=rings[i];R0.life-=dt;R0.r+=260*dt;if(R0.life<=0)rings.splice(i,1);}
  for(i=drops.length-1;i>=0;i--){var D=drops[i];if(D.z>0||D.vz){D.vz-=1400*dt;D.z+=D.vz*dt;if(D.z<=0){D.z=0;D.vz=D.vz<-200?-D.vz*0.35:0;}}D.life-=dt;if(D.life<=0)drops.splice(i,1);}
  shake*=Math.pow(0.001,dt);
}

  h+='<div class="row">📳 Vibration<button class="tg'+(S.vib?' on':'')+'" id="tgV"></button></div>';
  var nd=S.disc.filter(Boolean).length;
  h+='<div class="stats">Total goo made: <b>'+fmt(S.total)+'</b><br>Squishes: <b>'+fmt(S.squishes)+'</b> · Merges: <b>'+fmt(S.merges)+'</b><br>Slimedex: <b>'+nd+'/'+TIERS.length+'</b> · Ascensions: <b>'+S.asc+'</b> · Royal Jelly: <b>'+S.rj+'</b></div>';
  h+='<button class="danger" id="rst">Reset all progress</button><div class="stats" style="text-align:center;padding-top:14px">Slime Farm v1 · progress autosaves on this device</div>';
  $('setList').innerHTML=h;
  $('tgS').addEventListener('click',function(){S.sound=!S.sound;this.classList.toggle('on',S.sound);ac();sBuy();save();});
  $('tgV').addEventListener('click',function(){S.vib=!S.vib;this.classList.toggle('on',S.vib);buzz(20);save();});
  $('rst').addEventListener('click',function(){queueModal(function(){showModal('<div style="font-size:54px">⚠️</div><h2>Reset everything?</h2><p>All goo, slimes, upgrades, Royal Jelly and your Slimedex will be deleted. This cannot be undone.</p><button class="mbtn red" id="mOk">Yes, reset</button><button class="mbtn alt" id="mNo">Cancel</button>',{mOk:hardReset,mNo:null});});});
}
function hardReset(){try{localStorage.removeItem(KEY);}catch(e){}S=fresh();SL=[];drops=[];parts=[];texts=[];spawnSlime(0,true);spawnSlime(0,true);closeAll();save();updUI();}

// modal queue
var mq=[],mOpen=false,modalSlime=-1,nsCtx=null;
function queueModal(fn){mq.push(fn);if(!mOpen)nextModal();}
function nextModal(){var fn=mq.shift();if(fn){mOpen=true;fn();}else{mOpen=false;$('modal').classList.remove('open');modalSlime=-1;nsCtx=null;}}
function showModal(html,handlers){
  $('mbox').innerHTML=html;$('modal').classList.add('open');
  Object.keys(handlers||{}).forEach(function(id){var el=$(id);if(el)el.addEventListener('click',function(){var f=handlers[id];modalSlime=-1;nsCtx=null;if(f)f();nextModal();});});
}
function newSlimeModal(t,bonus){
  showModal('<div class="rays"></div><div class="rel"><span class="newtag">NEW SLIME!</span><canvas id="nsc" width="340" height="340"></canvas><h2>'+TIERS[t].n+'</h2><p>'+TIERS[t].t+'</p><p>Makes <b>'+fmt(tierGps(t))+' goo/s</b> each · Tier '+(t+1)+'</p><p style="color:#c18a06">+'+fmt(bonus)+' discovery bonus!</p><button class="mbtn" id="mOk">Awesome!</button></div>',{mOk:null});
  modalSlime=t;nsCtx=$('nsc').getContext('2d');
}
function drawModalSlime(){if(modalSlime<0||!nsCtx)return;var g=nsCtx;g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,170,170);var b=Math.abs(Math.sin(T*3)),sq=Math.max(0,0.18-b*0.5)*(b<0.25?1:0);g.fillStyle='rgba(0,0,0,.12)';g.beginPath();g.ellipse(85,150,48*(1-b*0.3),10,0,0,7);g.fill();drawSlime(g,85,150-b*24,56,modalSlime,{t:T,sq:b<0.2?0.2-b:-(b-0.2)*0.08,blink:(T%3)<0.12});}
var toastT=0,toastMsg='';
function toast(m){texts.push({x:W/2,y:H-40,txt:m,life:1.4,col:'#ff4d6d',sz:17});}

var gooEl=$('goo'),gpsEl=$('gps');
function updUI(){
  gooEl.textContent=fmt(S.goo);gpsEl.textContent='+'+fmt(gps())+' goo/s';
  $('pen').textContent=SL.length+'/'+penMax();
  var c=buyCost(),full=SL.length>=penMax();
  $('buyName').textContent='Adopt '+TIERS[lvl('spawn')].n;
  $('buySub').textContent=full?'Pen full — merge twins!':'Makes '+fmt(tierGps(lvl('spawn'))*gooMult()*rjMult())+' goo/s';
  $('buyCost').textContent=fmt(c);
  $('buy').classList.toggle('off',full||S.goo<c);
  if(S.rj>0){$('rjb').style.display='block';$('rj').textContent=S.rj;}else $('rjb').style.display='none';
  var any=UPS.some(function(u){var l=lvl(u.k);return l<u.max&&S.goo>=u.cost(l);})||(S.maxRun>=ASC_TIER&&rjGain()>=1);
  $('shopDot').style.display=any?'block':'none';
  var unseen=0;TIERS.forEach(function(t,i){if(S.disc[i]&&!S.seen[i])unseen++;});
  $('dexDot').style.display=unseen?'block':'none';$('dexDot').textContent=unseen;
  refreshShop();
}

// ---------- save/load ----------
function save(){S.slimes=SL.map(function(s){return s.tier;});S.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){
  var d=null;try{d=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  if(d&&typeof d==='object'){var f=fresh();S=Object.assign(f,d);S.up=Object.assign(fresh().up,d.up||{});SL=[];(S.slimes||[]).forEach(function(t){if(SL.length<penMax()){var p=randPos(t),s=mk(t,p.x,p.y,0);s.age=5;SL.push(s);}});return true;}
  S=fresh();SL=[];spawnSlime(0,false);spawnSlime(0,false);return false;
}
var OFFCAP=8*3600;
function offline(sec,showMin){
  var s=Math.min(sec,OFFCAP),g=gps()*s;if(g<=0)return 0;addGoo(g);
  if(sec>=showMin)queueModal(function(){showModal('<div style="font-size:54px">😴</div><h2>Welcome back!</h2><p>While you were away'+(sec>OFFCAP?' (max 8h)':'')+' for <b>'+fmtTime(s)+'</b>, your slimes made</p><div class="big"><span class="drop"></span> '+fmt(g)+' goo</div><button class="mbtn" id="mOk">Collect!</button>',{mOk:function(){sCoin();burst(W/2,H/2,'#7be36b',30,400);}});});
  return g;
}

// ---------- boot ----------
function resize(){
  var b=field.getBoundingClientRect();W=Math.max(100,b.width);H=Math.max(100,b.height);DPR=Math.min(3,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);baseR=Math.max(20,Math.min(36,Math.min(W,H*0.85)*0.072));renderBg();
}
window.addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe(field);
resize();
var had=load();
if(had){var away=(Date.now()-(S.last||Date.now()))/1000;if(away>5)offline(away,60);}
var lastT=performance.now(),uiAcc=0;
function frame(now){
  var dt=(now-lastT)/1000;lastT=now;
  if(dt>3){offline(dt,60);dt=0;}
  dt=Math.min(dt,0.05);
  tick(dt);render();drawModalSlime();
  uiAcc+=dt;if(uiAcc>0.1){uiAcc=0;updUI();}
  requestAnimationFrame(frame);
}
updUI();requestAnimationFrame(frame);
setInterval(save,5000);
document.addEventListener('visibilitychange',function(){if(document.hidden)save();else lastT=performance.now()-(Date.now()-S.last);});
window.addEventListener('pagehide',save);
// apple touch icon
try{var ic=document.createElement('canvas');ic.width=ic.height=180;var ig=ic.getContext('2d');var bg=ig.createLinearGradient(0,0,0,180);bg.addColorStop(0,'#d6fadb');bg.addColorStop(1,'#86dc92');ig.fillStyle=bg;ig.fillRect(0,0,180,180);drawSlime(ig,90,150,62,0,{t:0});$('ati').href=ic.toDataURL('image/png');}catch(e){}

window.__sf={get S(){return S;},get SL(){return SL;},tick:tick,sim:function(sec,step){step=step||0.1;for(var t=0;t<sec;t+=step)tick(step);updUI();},save:save,load:load,gps:gps,buySlime:buySlime,buyUp:buyUp,doMerge:doMerge,ascend:ascend,rjGain:rjGain,buyCost:buyCost,UPS:UPS,TIERS:TIERS,fmt:fmt,squish:squish,closeModals:function(){mq=[];nextModal();},modalOpen:function(){return mOpen;},penMax:function(){return penMax();},spawn:spawnSlime,updUI:updUI};
})();
</script>
