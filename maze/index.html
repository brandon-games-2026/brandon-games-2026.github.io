let AC=null,master=null,noiseBuf=null,acted=false;
const sndLast={};
function initAudio(){acted=true;if(AC){if(AC.state==='suspended')AC.resume();return;}
 try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=SV.sound?0.55:0;master.connect(AC.destination);
 noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const b=AC.createBufferSource();b.buffer=AC.createBuffer(1,1,22050);b.connect(master);b.start(0);}catch(e){AC=null;}}
function setMute(){if(master)master.gain.value=SV.sound?0.55:0;}
function tone(f,dur,type,vol,f2,delay){if(!AC||!SV.sound)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);

 net.peer=peer;

 peer.on('error',err=>{if(gen!==net.gen)return;if(err.type==='unavailable-id'&&attempt<6){startHost(attempt+1);return;}
  if(net.connected){if(err.type==='peer-unavailable'||err.type==='webrtc')onDisconnect();return;}$('hostErr').textContent=errText(err);$('hostStatus').textContent='';});

 $('joinStatus').textContent='Connecting…';$('bConnect').disabled=true;

function onData(d){if(!d||typeof d!=='object')return;net.lastRecv=performance.now();
 switch(d.t){
 case 'start':if(!net.isHost){net.myFrags=d.mf|0;net.theirFrags=d.tf|0;net.myWins=d.mw|0;net.theirWins=d.tw|0;startRound(d.seed>>>0,d.r|0);}break;

 case 'bw':{const w=WEAPONS.find(x=>x.id===el.dataset.w);if(SV.weapons[w.id])break;if(SV.coins<w.cost){sfx('no');break;}SV.coins-=w.cost;SV.weapons[w.id]=1;SV.equip=w.id;wIdx=WBY[w.id];clips[wIdx]=clipOf(wIdx);if(w.ammo)reserve[w.ammo]=Math.max(reserve[w.ammo],Math.round(AMMO_MAX[w.ammo]*0.6));sfx('buy');buzz(20);checkAch();save();refreshShop();break;}
 case 'equip':{SV.equip=el.dataset.w;wIdx=WBY[SV.equip];save();refreshShop();break;}
 case 'next':if(mode==='mp'){if(net.isHost)hostStartRound(net.round+1);}else{nextFloor();lockPointer();}break;
 case 'retry':startRun(mode==='daily'?'daily':'solo');lockPointer();break;

 case 'join':if(typeof Peer!=='function'){$('mErr').textContent='Online play unavailable (could not load PeerJS). Check your connection and reload.';break;}showScreen('join');$('joinErr').textContent='';$('joinStatus').textContent='';$('bConnect').disabled=false;setTimeout(()=>$('codeIn').focus(),50);break;
 }}

 for(const t of e.changedTouches){if(t.clientX<cssW*0.45&&joy.id===null){joy.id=t.identifier;joy.ox=t.clientX;joy.oy=t.clientY;joy.x=joy.y=0;stick.style.left=t.clientX+'px';stick.style.top=t.clientY+'px';stick.style.display='block';knob.style.transform='translate(0,0)';$('stickHint').style.display='none';}
  else if(look.id===null){look.id=t.identifier;look.lx=t.clientX;}}},{passive:false});

 if(t.identifier===joy.id){let dx=t.clientX-joy.ox,dy=t.clientY-joy.oy;const m=Math.hypot(dx,dy),R=50;if(m>R){dx*=R/m;dy*=R/m;}
  // dead zone + slight curve so small moves are precise
  const n=Math.min(1,m/R);const k=n<0.12?0:Math.pow((n-0.12)/0.88,1.2)/(n||1);joy.x=dx/R*k;joy.y=dy/R*k;knob.style.transform='translate('+dx+'px,'+dy+'px)';}
 else if(t.identifier===look.id){if(state==='play'||state==='respawn')ang+=(t.clientX-look.lx)*0.0068*SV.sens;look.lx=t.clientX;}}},{passive:false});

let lastT=performance.now(),qAcc=0,qFrames=0,qWork=0,qGood=0;
const perf={fps:0,work:0,q:0};
function frame(now){requestAnimationFrame(frame);let dt=(now-lastT)/1000;lastT=now;if(dt>0.1)dt=0.1;if(dt<0)dt=0;

 update(dt);
 if(map){buildSprites();renderWorld();}
 drawUI(dt);if(state==='play'||state==='respawn')updHud(dt);
 const work=performance.now()-t0;
 qAcc+=dt;qFrames++;qWork+=work;
 if(qAcc>=1){const avgDt=qAcc/qFrames*1000,avgW=qWork/qFrames;perf.fps=Math.round(1000/avgDt);perf.work=+avgW.toFixed(2);perf.q=qIdx;

{const g=genMaze(9,777,0.12,0);map=g.m;seen=new Uint8Array(N*N);px=1.5;py=1.5;ang=0.3;
