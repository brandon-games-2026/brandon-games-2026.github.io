<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.card.r3 .cn{background:linear-gradient(90deg,#fff3b0,#ffb020);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// MP generator: identical algorithm to v1 so host and joiner match
function genMaze(cells,seed,loops,arena){
 const rnd=mulberry32(seed);N=cells*2+1;const m=new Uint8Array(N*N).fill(1);
 const st=[[1,1]];m[N+1]=0;
 while(st.length){const c=st[st.length-1],x=c[0],y=c[1];const nb=[];
  if(x>1&&m[y*N+x-2])nb.push([-2,0]);if(x<N-2&&m[y*N+x+2])nb.push([2,0]);if(y>1&&m[(y-2)*N+x])nb.push([0,-2]);if(y<N-2&&m[(y+2)*N+x])nb.push([0,2]);
  if(!nb.length){st.pop();continue;}const d=nb[Math.floor(rnd()*nb.length)];m[(y+d[1]/2)*N+x+d[0]/2]=0;m[(y+d[1])*N+x+d[0]]=0;st.push([x+d[0],y+d[1]]);}
 if(loops){for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){if(m[y*N+x]!==1)continue;
  if((x&1)===0&&(y&1)===1&&m[y*N+x-1]===0&&m[y*N+x+1]===0&&rnd()<loops)m[y*N+x]=0;
  else if((x&1)===1&&(y&1)===0&&m[(y-1)*N+x]===0&&m[(y+1)*N+x]===0&&rnd()<loops)m[y*N+x]=0;}}
 if(arena){for(let y=N-arena-1;y<N-1;y++)for(let x=N-arena-1;x<N-1;x++)m[y*N+x]=0;
  // a few pillars for cover
  const c=N-1-((arena+1)>>1);m[(c-2)*N+c-2]=1;m[(c+2)*N+c+2]=1;m[(c-2)*N+c+2]=1;m[(c+2)*N+c-2]=1;}
 m[(N-2)*N+N-1]=arena?3:2;
 return {m,rnd};}
function mazeHash(){let h=2166136261>>>0;for(let i=0;i<map.length;i++){h^=map[i];h=Math.imul(h,16777619)>>>0;}return h.toString(16);}
function solidAt(x,y){if(x<0||y<0||x>=N||y>=N)return true;const v=map[(y|0)*N+(x|0)];return v===1||v===3||v===4;}
function cellAt(x,y){return map[(y|0)*N+(x|0)];}
let fdist=null,fq=null,fcell=-1;
function flowField(sx,sy){const n=N*N;if(!fdist||fdist.length!==n){fdist=new Int16Array(n);fq=new Int32Array(n);}fdist.fill(-1);
 let h=0,t=0;const s=sy*N+sx;fdist[s]=0;fq[t++]=s;
 while(h<t){const c=fq[h++],d=fdist[c]+1;
  const a=c-1,b=c+1,u=c-N,w=c+N;
  let v=map[a];if((v===0||v===4)&&fdist[a]<0){fdist[a]=d;fq[t++]=a;}v=map[b];if((v===0||v===4)&&fdist[b]<0){fdist[b]=d;fq[t++]=b;}
  v=map[u];if((v===0||v===4)&&fdist[u]<0){fdist[u]=d;fq[t++]=u;}v=map[w];if((v===0||v===4)&&fdist[w]<0){fdist[w]=d;fq[t++]=w;}}}
function bfsFrom(sx,sy){const n=N*N,d=new Int16Array(n).fill(-1),q=new Int32Array(n);let h=0,t=0;const s=sy*N+sx;d[s]=0;q[t++]=s;
 while(h<t){const c=q[h++];for(const o of [1,-1,N,-N]){const k=c+o;if(k>=0&&k<n&&map[k]!==1&&map[k]!==3&&d[k]<0){d[k]=d[c]+1;q[t++]=k;}}}return d;}
