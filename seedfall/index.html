function takeOffer(i){const o=offers[i];if(!o)return;sfx('buy');
 if(o.k==='up'){SV.pegLv[o.t]=(SV.pegLv[o.t]||1)+1;save();toast('⬆️ '+offerDesc({k:'up',t:o.t}).t.replace(/Lv \d+/,'upgraded'),'');offers=[];startJar('garden');return;}
 placeMode=o.t;offers=[];hideOv();state='place';
 sim=makeSim({seed:1,pegs:SV.board.slice(),jar:SV.jar,events:false});if(SV.jar!==curJar){curJar=SV.jar;buildCaches();}
 $('hud').style.display='none';$('place').style.display='flex';$('placeTxt').innerHTML='Tap a peg to plant '+PEGS[o.t].e+' '+PEGS[o.t].n+'<small>Leaf pegs are free spots. You can also replace a special peg.</small>';}
function placeAt(lx,ly){let bi=-1,bd=44*44;for(let i=0;i<SLOTS.length;i++){const dx=SLOTS[i].x-lx,dy=SLOTS[i].y-ly,d2=dx*dx+dy*dy;if(d2<bd){bd=d2;bi=i;}}if(bi<0)return false;
 SV.board[bi]=placeMode;SV.placed++;if(SV.placed>=10)unlockAch('pegs10');sim.pegs[bi].t=placeMode;pegWob[bi]=1;parts(SLOTS[bi].x,SLOTS[bi].y,24,[PEGS[placeMode].c,'#fff'],160,3,2);sfx('combo');save();
 const t=placeMode;placeMode=null;$('place').style.display='none';setTimeout(()=>startJar('garden'),650);return true;}
// ---------------- MENUS ----------------
function hideOv(){$('ov').classList.remove('show');document.body.classList.remove('ovs');}
function showOv(h){$('ovb').innerHTML=h;$('ov').classList.add('show');document.body.classList.add('ovs');$('ov').scrollTop=0;}
function toast(t,s){const d=document.createElement('div');d.className='toast';d.innerHTML=t+(s?'<small>'+s+'</small>':'');const b=$('toasts');b.appendChild(d);while(b.children.length>2)b.firstChild.remove();setTimeout(()=>d.remove(),3000);}
function unlockAch(id){if(SV.ach[id])return;const a=ACH.find(x=>x.id===id);if(!a)return;SV.ach[id]=Date.now();SV.bloom+=a.r;SV.totalBloom+=a.r;toast('🏆 '+a.n,a.d+' · +'+a.r+' 🌸');sfx('ach');save();}
function wxHTML(){const w=weatherAt(Date.now());return w.active?'<div class="wx on" id="wxCard">'+w.ev.e+' '+w.ev.n.toUpperCase()+' — NOW! <span id="wxT">'+fmtT(w.left)+'</span> left<small>'+w.ev.d+' (garden runs)</small></div>':
 '<div class="wx" id="wxCard">Next weather: '+w.nextEv.e+' '+w.nextEv.n+' in <span id="wxT">'+fmtT(w.next)+'</span><small>Same time for everyone (UTC) · '+w.nextEv.d+'</small></div>';}
function showTitle(){state='title';mode='garden';$('hud').style.display='none';$('place').style.display='none';const d=dayNum(Date.now());const dd=SV.daily[d];
 const bookN=Object.keys(SV.book).length,bookMax=TIERS.length*(MUTK.length+1);const achN=Object.keys(SV.ach).length;
 showOv('<h1>Seedfall</h1><div class="sub">Drop seeds · mutate · merge · bloom</div>'+wxHTML()+
  (ghost?'<div class="wx on">👻 '+esc(ghost.name||'A friend')+' challenged you: <b>'+fmt(ghost.final)+'</b>'+(ghost.day?' on Daily #'+ghost.day:'')+'<small>'+(ghost.ok?'Replay verified ✓ same board, same physics':'⚠ replay mismatch')+'</small></div><button class="btn p" data-act="challenge" id="bChallenge">👻 Beat their run</button>':'')+
  '<div class="stats"><div><b>'+fmt(SV.best)+'</b>Best jar</div><div><b style="color:#ffc2ea">'+fmt(SV.bloom)+'</b>Bloom</div><div><b>'+bookN+'/'+bookMax+'</b>Book</div><div><b>'+achN+'/'+ACH.length+'</b>Trophies</div></div>'+
  '<button class="btn" data-act="garden" id="bPlay">▶ PLAY GARDEN<small>Season '+SV.season+' · '+JARS[SV.jar].e+' '+JARS[SV.jar].n+(SV.gift?' · 🐝 gift seed ready':'')+'</small></button>'+
  '<button class="btn y" data-act="daily" id="bDaily">📅 DAILY BLOOM #'+d+'<small>'+(dd?'Today: '+fmt(dd.score)+' · tap to share or practice':'One official run on today\'s board · same for everyone')+'</small></button>'+
  '<div class="row"><button class="btn d" data-act="practice" id="bPractice">🎲 Practice</button><button class="btn d" data-act="gh" id="bGH">🏡 Garden'+(SV.gh.bank>=1?' <span style="color:#ffc2ea">+'+fmt(SV.gh.bank)+'</span>':'')+'</button></div>'+
  '<div class="row"><button class="btn d" data-act="book" id="bBook">📖 Book</button><button class="btn d" data-act="trophies">🏆 Trophies</button><button class="btn d" data-act="settings">⚙️</button></div>'+
  '<div class="help">'+(isTouch?'Drag anywhere to aim, release to drop.':'Move the mouse to aim, click to drop (or ← → and Space).')+' Pegs mutate seeds: ❄️+🪙 = 💎 ×25!</div>');}
function showDailyDone(){const d=dayNum(Date.now());const dd=SV.daily[d];lastRes={share:dd.share,link:dd.link};
 showOv('<h2>📅 Daily Bloom #'+d+'</h2><div class="sub">Your official score today</div><div class="bloom" style="font-size:26px">'+fmt(dd.score)+'</div><div class="grid">'+esc(dd.share.split('\n').filter(l=>l.indexOf('http')<0).join('\n'))+'</div><button class="btn p" data-act="share" id="bShare">📤 Share</button><button class="btn d" data-act="dailyprac">Practice today\'s board (unofficial)</button><button class="btn d" data-act="title">Back</button><div class="err" id="shareMsg"></div><div class="help">New board in '+fmtT((86400000-(Date.now()-EPOCH)%86400000)/1000)+'</div>');}
function showBook(){const rows=TIERS.map((T,t)=>{const has=SV.book[t+':'];let n=has?1:0;const ms=MUTK.map(m=>{const f=SV.book[t+':'+m];if(f)n++;return f?MUT[m].e:'·';}).join('');
  return '<div class="bk'+(has?'':' lock')+'"><span class="e">'+(has?T.e:'❔')+'</span>'+(has?T.n:'???')+'<br><span style="opacity:.7">'+n+'/'+(MUTK.length+1)+'</span><div class="m">'+ms+'</div></div>';}).join('');
 const combos=COMBOS.map(c=>'<div class="it'+(SV.seen[c[2]]?'':' ach')+'" style="'+(SV.seen[c[2]]?'':'opacity:.5')+'"><div class="ic">'+MUT[c[2]].e+'</div><div class="tx">'+MUT[c[2]].n+' ×'+MUT[c[2]].x+'<small>'+MUT[c[0]].e+' '+MUT[c[0]].n+' + '+MUT[c[1]].e+' '+MUT[c[1]].n+'</small></div></div>').join('');
 showOv('<h2>📖 Collection</h2><div class="sub">'+Object.keys(SV.book).length+' / '+TIERS.length*(MUTK.length+1)+' species × mutations discovered</div><div class="book">'+rows+'</div><div class="sec" style="text-align:left;font-weight:900;opacity:.6;margin-top:14px">COMBO RECIPES</div><div class="list">'+combos+'</div><button class="btn d" data-act="title">Back</button>');}
function showTrophies(){showOv('<h2>🏆 Trophies '+Object.keys(SV.ach).length+'/'+ACH.length+'</h2><div class="list">'+ACH.map(a=>'<div class="it" style="'+(SV.ach[a.id]?'':'opacity:.45')+'"><div class="ic">'+(SV.ach[a.id]?'🏆':'🔒')+'</div><div class="tx">'+a.n+'<small>'+a.d+'</small></div><b style="color:#ffc2ea">+'+a.r+'</b></div>').join('')+'</div><button class="btn d" data-act="title">Back</button>');}
function showSettings(){showOv('<h2>⚙️ Settings</h2><div class="sum"><div><span>Sound</span><button class="buy" data-act="mute">'+(SV.mute?'OFF':'ON')+'</button></div><div style="display:block"><span>Your name (shown on links you share)</span><input type="text" id="nameIn" maxlength="16" value="'+esc(SV.name)+'" placeholder="Brandon"></div></div><button class="btn d" data-act="title">Back</button><button class="btn d" style="opacity:.6;font-size:13px" data-act="reset">Reset all progress</button>');
 $('nameIn').oninput=e=>{SV.name=e.target.value.slice(0,16);save();};}
function showPause(){state='pause';showOv('<h2>Paused</h2><div class="sub">'+$('scl').textContent+' · '+fmt(sim.score)+'</div><button class="btn" data-act="resume" id="bResume">▶ Resume</button><button class="btn y" data-act="harvest">🧺 '+(mode==='garden'?'Harvest now':'End run & score')+'</button><button class="btn d" data-act="mute">'+(SV.mute?'🔇 Sound off':'🔊 Sound on')+'</button>');}
function onAct(a,el){initAudio();sfx('click');
 switch(a){
 case 'garden':startJar('garden');break;
 case 'daily':{const d=dayNum(Date.now());if(SV.daily[d])showDailyDone();else startJar('daily');break;}
 case 'dailyprac':startJar('daily');break;
 case 'practice':startJar('practice');break;
 case 'challenge':startJar('challenge');break;
 case 'title':history.replaceState(null,'',location.pathname+location.search);showTitle();break;
 case 'gh':showGreenhouse(state==='pick'?'pick':'title');break;
 case 'ghback':if(returnTo==='pick')showPick(true);else showTitle();break;
 case 'book':showBook();break;case 'trophies':showTrophies();break;case 'settings':showSettings();break;
 case 'pick':showPick();break;
 case 'offer':takeOffer(+el.dataset.i);break;
 case 'reroll':if(SV.bloom<15){sfx('no');break;}SV.bloom-=15;save();offers=[];showPick();break;
 case 'skip':offers=[];startJar('garden');break;
 case 'collect':{const v=Math.floor(SV.gh.bank);if(v<1){sfx('no');break;}SV.bloom+=v;SV.totalBloom+=v;SV.gh.bank-=v;sfx('harvest');toast('🌸 +'+fmt(v)+' Bloom','');save();showGreenhouse();break;}
 case 'ghu':{const u=GHU.find(x=>x.k===el.dataset.k);const l=u.lv();if(l>=u.max)break;const c=u.cost(l);if(SV.bloom<c){sfx('no');break;}SV.bloom-=c;SV.gh[u.k]=(SV.gh[u.k]||0)+1;sfx('buy');if(SV.gh.max>=6)unlockAch('pots6');save();showGreenhouse();break;}
 case 'jar':SV.jar=el.dataset.j;save();showGreenhouse();break;
 case 'season':if(!canSeason())break;if(!confirm('Start season '+(SV.season+1)+'? Your board pegs and peg upgrades reset. Greenhouse, Bloom and collection stay.'))break;
  SV.season++;SV.board=defaultBoard();SV.pegLv={};SV.seasonBest=0;if(SV.season>=2)SV.jars.bowl=1;if(SV.season>=3)SV.jars.flask=1;if(SV.season>=2)unlockAch('season2');if(SV.season>=3)unlockAch('season3');save();sfx('jackpot');toast('🌱 Season '+SV.season+'!','New pegs and jars unlocked');showGreenhouse();break;
 case 'sharegarden':doShare('🏡 Visit my Seedfall garden'+(SV.name?' ('+SV.name+')':'')+'! '+SV.gh.pots.map(p=>TIERS[p.t].e).join('')+'\n'+baseURL()+'#g='+gardenCode());break;
 case 'pollinate':{const G=window.__visit;if(!G)break;const key=G.code.slice(0,40);const today=dayNum(Date.now());if(SV.pollinated[key]===today)break;SV.pollinated[key]=today;
  let best=null,bv=0;for(const p of G.pots)for(const m of p.m)if(MUT[m].x>bv){bv=MUT[m].x;best=m;}SV.gift=[best||'gold'];unlockAch('pollen');save();sfx('combo');toast('🐝 Pollinated!','Gift seed: '+MUT[SV.gift[0]].e+' '+MUT[SV.gift[0]].n+' on your next garden jar');showVisit(G);break;}
 case 'share':if(lastRes&&lastRes.share)doShare(lastRes.share);break;
 case 'resume':state='play';hideOv();break;
 case 'harvest':hideOv();state='play';endRun();break;
 case 'mute':SV.mute=!SV.mute;setMute();save();if(state==='pause')showPause();else showSettings();break;
 case 'reset':if(confirm('Reset ALL Seedfall progress?')){localStorage.removeItem(SAVE_KEY);loadSave();save();showTitle();}break;
 }}
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('[data-act]');if(el&&!el.disabled){e.preventDefault();onAct(el.dataset.act,el);}});
$('bMenu').addEventListener('click',()=>{initAudio();if(state==='play')showPause();});
$('bMute').addEventListener('click',()=>{initAudio();SV.mute=!SV.mute;setMute();save();});
$('bHarv').addEventListener('click',()=>{initAudio();if(state!=='play')return;if(harvArm>0){harvArm=0;endRun();}else{harvArm=2.5;toast('🧺 Tap again to harvest now','');}});
// ---------------- INPUT ----------------
function toLogical(cx,cy){return [(cx-OX)/SC,(cy-OY)/SC];}
function aimFrom(cx){const lx=(cx-OX)/SC;aimQ=clamp(Math.round((lx-24)/352*255),0,255);}
let dragging=false;
function pDown(cx,cy){initAudio();if(state==='place'){const l=toLogical(cx,cy);placeAt(l[0],l[1]);return;}if(state!=='play')return;dragging=true;aimFrom(cx);hintA=0;}
function pMove(cx){if(state==='play'&&(dragging||!isTouch))aimFrom(cx);}
function pUp(){if(state==='play'&&dragging){pendingDrop=aimQ;}dragging=false;}
cv.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];pDown(t.clientX,t.clientY);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();pMove(e.changedTouches[0].clientX);},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();pUp();},{passive:false});
cv.addEventListener('touchcancel',()=>{dragging=false;});
cv.addEventListener('mousedown',e=>{if(isTouch)return;pDown(e.clientX,e.clientY);});
window.addEventListener('mousemove',e=>{if(isTouch)return;pMove(e.clientX);});
window.addEventListener('mouseup',()=>{if(isTouch)return;pUp();});
window.addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;if(state!=='play')return;if(e.code==='ArrowLeft')aimQ=clamp(aimQ-8,0,255);if(e.code==='ArrowRight')aimQ=clamp(aimQ+8,0,255);if(e.code==='Space'||e.code==='Enter'){e.preventDefault();initAudio();pendingDrop=aimQ;hintA=0;}});
document.addEventListener('touchmove',e=>{if(!(e.target.closest&&e.target.closest('.scr')))e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();if(state==='play')showPause();}else{const now=Date.now();const off=(now-SV.last)/1000;if(off>30)ghAccrue(off);SV.last=now;}});
addEventListener('pagehide',save);
addEventListener('resize',()=>{readSafe();resize();});
// ---------------- HUD ----------------
const hc={};function st(id,v){if(hc[id]!==v){hc[id]=v;$(id).textContent=v;}}
let hudT=0;
function updHud(force){if(!sim)return;st('scv',fmt(sim.score));
 st('nx','Next '+TIERS[sim.queue[1]].e+'  🌰'+Math.max(0,sim.bag-sim.drops));st('ch',sim.chain>1?'🔥 Chain ×'+sim.chain:'Best ×'+sim.maxChain);
 const w=wxCache;st('wx',mode==='garden'&&w&&w.active?w.ev.e+' '+fmtT(w.left):'');
 if(mode==='challenge'&&ghost){const i=Math.min(ghost.tl.length-1,Math.floor(sim.step/30));st('ghost','👻 '+fmt(ghost.tl[i]));}else st('ghost','');}
// ---------------- MAIN LOOP ----------------
let lastT=performance.now(),pf={acc:0,n:0,w:0,fps:0,work:0,steps:0};let saveT=0;
function frame(now){requestAnimationFrame(frame);let dt=(now-lastT)/1000;lastT=now;if(dt>0.1)dt=0.1;if(dt<0)dt=0;const t0=performance.now();
 wxT-=dt;if(wxT<=0||!wxCache){wxT=0.5;wxCache=weatherAt(Date.now());if(state==='title'){const e=$('wxT');if(e)e.textContent=fmtT(wxCache.active?wxCache.left:wxCache.next);}}
 if(harvArm>0)harvArm-=dt;
 if(state==='play'&&sim&&!sim.over){acc+=dt*speedMul;let n=0;const maxS=Math.max(4,Math.ceil(speedMul*2));
  while(acc>=STEP&&n<maxS){if(pendingDrop!==null&&canDrop(sim)){const s=sim.step,x=pendingDrop;if(dropSeed(sim,x))rec.push({s,x});pendingDrop=null;}simStep(sim);acc-=STEP;n++;if(sim.over)break;}
  if(n>=maxS)acc=0;pf.steps+=n;handleEvents();weatherTick(dt);if(sim.over){finalize(sim);state='over';overT=0;sfx('harvest');buzz(60);}}
 if(state==='over'){if(overT===0)onOverStart();handleEvents();overTick(dt);}
 ghAccrue(dt);saveT+=dt;if(saveT>10){saveT=0;save();}
 if(sim&&(state==='play'||state==='over'||state==='place'||state==='pause'||state==='results'||state==='pick'))render(dt,now/1000);else renderIdle(dt,now/1000);
 hudT-=dt;if(hudT<=0&&state==='play'){hudT=0.1;updHud();}
 const w=performance.now()-t0;pf.acc+=dt;pf.n++;pf.w+=w;if(pf.acc>=1){pf.fps=Math.round(pf.n/pf.acc);pf.work=+(pf.w/pf.n).toFixed(2);pf.acc=0;pf.n=0;pf.w=0;}}
let idleSim=null;
function renderIdle(dt,now){if(!idleSim){idleSim=makeSim({seed:42,pegs:genBoard(42),jar:'classic',events:false});const r=mulberry32(3);for(let i=0;i<14;i++){const b=newBody(idleSim,60+r()*280,JB-40-r()*200,Math.floor(r()*6));b.inJar=true;b.m=r()<0.3?[MUTK[Math.floor(r()*6)]]:[];idleSim.B.push(b);}for(let i=0;i<400;i++)simStep(idleSim);}
 if(Math.random()<dt*0.8&&idleSim.B.length<26){idleSim.cool=0;dropSeed(idleSim,Math.floor(Math.random()*256));}
 for(let i=0;i<2;i++)simStep(idleSim);if(idleSim.over){idleSim=null;return;}const keep=sim,ks=state;sim=idleSim;state='idle';render(dt,now);sim=keep;state=ks;}
// ---------------- BOOT ----------------
function makeIcon(){try{const c=mk(180,180),g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,180);gr.addColorStop(0,'#123a5a');gr.addColorStop(1,'#0c3a2a');g.fillStyle=gr;g.fillRect(0,0,180,180);
 g.fillStyle='#5fd07a';for(let r=0;r<3;r++)for(let i=0;i<4-r%2;i++){g.beginPath();g.arc(40+i*34+(r%2)*17,40+r*26,5,0,7);g.fill();}
 const rg=g.createRadialGradient(80,110,6,90,124,34);rg.addColorStop(0,'#fff');rg.addColorStop(0.3,'#ffd04a');rg.addColorStop(1,'#b07400');g.fillStyle=rg;g.beginPath();g.arc(90,126,34,0,7);g.fill();
 g.font='40px "Apple Color Emoji","Noto Color Emoji",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('🌻',90,129);$('ati').href=c.toDataURL('image/png');}catch(e){}}
loadSave();setMute();readSafe();resize();makeIcon();
{const now=Date.now();const off=(now-(SV.last||now))/1000;if(off>60&&SV.gh.pots.length){const got=ghAccrue(off);if(got>=1)setTimeout(()=>toast('🏡 Welcome back!','Your greenhouse grew +'+fmt(Math.min(got,SV.gh.bank))+' Bloom while you were away ('+fmtT(Math.min(off,(8+4*SV.gh.lamp)*3600))+')'),600);}SV.last=now;}
wxCache=weatherAt(Date.now());
let bootMsg='';
try{const h=location.hash||'';
 if(h.startsWith('#r=')){const g=decodeRun(h.slice(3));const t0=performance.now();const rr=replayRun(seededCfg(g.seed),g.drops,g.end);g.final=rr.score;g.tl=rr.tl;g.ok=rr.score===g.score&&rr.bad===0;g.ms=performance.now()-t0;ghost=g;}
 else if(h.startsWith('#g=')){const G=decodeGarden(h.slice(3));setTimeout(()=>showVisit(G),0);}}catch(e){bootMsg='That link looks broken.';}
if(!location.hash.startsWith('#g=')){if(!SV.firstDone&&!ghost)startJar('garden');else showTitle();}
if(bootMsg)toast('⚠️ '+bootMsg,'');
requestAnimationFrame(frame);
window.__sd={get:()=>({state,mode,score:sim?sim.score:0,step:sim?sim.step:0,drops:sim?sim.drops:0,bodies:sim?sim.B.length:0,over:sim?sim.over:false,overT:sim?sim.overT:0,canDrop:sim?canDrop(sim):false,
  tierMax:sim?sim.tierMax:-1,maxChain:sim?sim.maxChain:0,jackpots:sim?sim.jackpots:0,bestMult:sim?sim.bestMult:1,seed:sim?sim.cfg.seed>>>0:0,pegs:sim?sim.cfg.pegs.join(','):'',firstChainT,perf:{fps:pf.fps,work:pf.work},rec:rec.length,
  bloom:SV.bloom,harvests:SV.harvests,day:dayNum(Date.now()),ghost:ghost?{final:ghost.final,score:ghost.score,ok:ghost.ok,ms:ghost.ms,drops:ghost.drops.length}:null}),
 aim:q=>{aimQ=q;},drop:q=>{if(q!==undefined)aimQ=q;pendingDrop=aimQ;},turbo:k=>{speedMul=k;},endRun,
 link:()=>lastRes&&lastRes.link,share:()=>lastRes&&lastRes.share,save:()=>JSON.parse(JSON.stringify(SV)),
 replayLast:()=>{const r=replayRun(seededCfg(sim.cfg.seed),rec,sim.endStep||0);return r.score;},
 headless:(seed,drops,end)=>replayRun(seededCfg(seed),drops,end).score,dailySeed:d=>dailySeed(d),genBoard:s=>genBoard(s).join(','),
 bodies:()=>sim?sim.B.map(b=>({t:b.t,x:b.x,y:b.y,m:b.m.slice()})):[],gardenLink:()=>baseURL()+'#g='+gardenCode(),act:(a,d)=>onAct(a,{dataset:d||{}}),addBloom:v=>{SV.bloom+=v;save();},
 wx:()=>weatherAt(Date.now()),slotXY:i=>({x:OX+SLOTS[i].x*SC,y:OY+SLOTS[i].y*SC}),board:()=>SV.board.slice(),jack:()=>({t:jack.t,s:jack.s,chain:chainShow.n})};
})();
