var NAMES=['','Thousand','Million','Billion','Trillion','Quadrillion','Quintillion','Sextillion','Septillion','Octillion','Nonillion'];
var NU=['','un','duo','tre','quattuor','quin','sex','septen','octo','novem'],NT=['','deci','viginti','triginta','quadraginta','quinquaginta','sexaginta','septuaginta','octoginta','nonaginta'],NH=['','centi','ducenti','trecenti','quadringenti','quingenti','sescenti','septingenti','octingenti','nongenti'];

// returns {n:'1.23',w:'Tredecillion'} ; w may be ''
function fmtParts(L){

function readCode(code){
