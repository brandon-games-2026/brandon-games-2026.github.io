// ---------- utils ----------
function fmt(n){
  if(!isFinite(n))return '∞';if(n<0)return '-'+fmt(-n);
  if(n<1000){if(n<10&&n%1>0.05)return (Math.floor(n*10)/10).toFixed(1);return String(Math.floor(n));}
  var e=Math.floor(Math.log10(n)/3);
  if(e<SUF.length){var v=n/Math.pow(10,3*e);return (v<10?(Math.floor(v*100)/100).toFixed(2):v<100?(Math.floor(v*10)/10).toFixed(1):String(Math.floor(v)))+SUF[e];}
  var x=Math.floor(Math.log10(n)),m=n/Math.pow(10,x);return (Math.floor(m*100)/100).toFixed(2)+'e'+x;
}
function fmtTime(s){s=Math.floor(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+'h '+m+'m':m?m+'m '+x+'s':x+'s';}
function srand(seed){seed=Math.floor(seed)%2147483646+1;return function(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};}
var $=function(id){return document.getElementById(id);};
function today(d){d=d||new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}

function fresh(){return{mass:0,total:0,run:0,gens:GENS.map(function(){return 0;}),tap:0,grip:0,dm:0,dmTotal:0,dmMv:0,qf:0,qfTotal:0,crunches:0,mvs:0,sk:{},qk:{},ach:{},achSeen:0,era:0,maxEra:0,mvMaxEra:0,day:'',streak:0,last:Date.now(),sound:true,vib:true,buy:1,st:{taps:0,stars:0,novas:0,bestCombo:0,time:0,runTime:0,napped:false}};}
var S=fresh();
var combo=0,lastTap=-9,buffs=[],T=0,autoAcc=0,starT=40,novaT=200,achT=0;
var events=[];
function sk(k){return S.sk[k]||0;}
function qk(k){return S.qk[k]||0;}
function achCount(){var n=0;for(var k in S.ach)if(S.ach[k])n++;return n;}
function totalGens(){return S.gens.reduce(function(a,b){return a+b;},0);}
function comboMaxMult(l){return 2+l;}
function comboMax(){return 50*(1+sk('combo'));}
function comboMult(){return 1+combo/comboMax()*(comboMaxMult(sk('combo'))-1);}
function G(){return (1+0.02*achCount()*(qk('eter')?2:1))*(1+0.1*S.dmTotal)*(1+0.05*Math.min(7,S.streak));}
function buffMult(kind){var m=1;buffs.forEach(function(b){if(b.k==='frenzy')m*=7;if(b.k==='shock'&&kind==='gps')m*=5;if(b.k==='tapf'&&kind==='tap')m*=10;});return m;}
function mileMult(l){var m=1;for(var i=0;i<MILE.length;i++)if(l>=MILE[i])m*=2;return m;}
function nextMile(l){for(var i=0;i<MILE.length;i++)if(l<MILE[i])return MILE[i];return 0;}
function genProd(i){return GENS[i][3]*S.gens[i]*mileMult(S.gens[i]);}
function gpsBase(){var s=0;for(var i=0;i<GENS.length;i++)s+=genProd(i);return s*Math.pow(1.5,sk('amp'))*Math.pow(3,qk('echo'))*G();}
function gps(){return gpsBase()*buffMult('gps');}
function tapBase(){return (1+S.tap)*Math.pow(2,Math.floor(S.tap/25))*Math.pow(2,sk('tap'))*G()+gpsBase()*0.01*S.grip;}
function tapVal(withCombo){return tapBase()*(withCombo?comboMult():1)*buffMult('tap');}
function disc(){return 1-0.05*sk('cheap');}
function genCost(i,lv){return GENS[i][2]*Math.pow(GR,lv)*disc();}
function tapCost(l){return 20*Math.pow(1.55,l);}
function gripCost(l){return 2000*Math.pow(4,l);}
var GRIPMAX=30;
function bulk(c0,r,mode,cap){
  if(mode==='max'){var n=Math.floor(Math.log(1+S.mass*(r-1)/c0)/Math.log(r));n=Math.max(0,Math.min(n,cap));if(n<1)return{n:1,cost:c0,ok:false};return{n:n,cost:c0*(Math.pow(r,n)-1)/(r-1),ok:true};}
  var k=Math.min(mode,cap);if(k<1)k=1;var c=c0*(Math.pow(r,k)-1)/(r-1);return{n:k,cost:c,ok:S.mass>=c};
}
var CR=1.3e9;
function dmMult(){return (1+0.25*sk('divi'))*Math.pow(2,qk('res'));}
var DMK=3.5;
function dmBase(){return Math.floor(DMK*Math.cbrt(S.run/CR)+1e-9);}
function dmAt(b){return CR*Math.pow(b/DMK,3);}
function dmGain(){return Math.floor(dmBase()*dmMult());}
function canMv(){return S.mvMaxEra>=10;}
function qfGain(){return Math.max(canMv()?1:0,Math.floor(Math.sqrt(S.dmMv/1000)));}
function offlineCap(){return qk('pat')?24*3600:(8+4*sk('time'))*3600;}
function offlineEff(){return qk('pat')?1:0.5+0.125*sk('time');}
function addMass(v){S.mass+=v;S.total+=v;S.run+=v;}
function eraOf(m){var e=0;for(var i=0;i<ERAS.length;i++)if(m>=ERAS[i].at)e=i;return e;}
function eraProg(){var e=S.era;if(e>=ERAS.length-1)return 1;var a=Math.max(1,ERAS[e].at),b=ERAS[e+1].at;var p=(Math.log(Math.max(1,S.run))-Math.log(a))/(Math.log(b)-Math.log(a));if(e===0)p=S.run/b;return Math.max(0,Math.min(1,p));}

// ---------- actions ----------
function doTap(x,y,auto,bonus){
  var v=tapVal(!auto)*(bonus||1);addMass(v);
  if(!auto){combo=Math.min(comboMax(),combo+1);lastTap=T;S.st.taps++;if(combo>S.st.bestCombo)S.st.bestCombo=Math.floor(combo);}
  if(x!==undefined){fx.tap(x,y,v,auto,bonus);}
  return v;
}
function buyGen(i){
  var c0=genCost(i,S.gens[i]),b=bulk(c0,GR,S.buy,100000);if(!b.ok||S.mass<b.cost){sErr();return false;}
  S.mass-=b.cost;var before=S.gens[i];S.gens[i]+=b.n;sBuy();buzz(8);
  if(nextMile(before)&&S.gens[i]>=nextMile(before)){toast('✨ '+GENS[i][0]+' milestone!','Production ×2');sAch();}
  return true;
}
function buyTap(){var b=bulk(tapCost(S.tap),1.55,S.buy,100000);if(!b.ok||S.mass<b.cost){sErr();return false;}S.mass-=b.cost;S.tap+=b.n;sBuy();buzz(8);return true;}
function buyGrip(){if(S.grip>=GRIPMAX)return false;var c=gripCost(S.grip);if(S.mass<c){sErr();return false;}S.mass-=c;S.grip++;sBuy();buzz(8);return true;}
function buySk(k){var s=SK.filter(function(x){return x.k===k;})[0],l=sk(k);if(!s||l>=s.max||!rowOpen(s.r))return false;var c=s.c(l);if(S.dm<c){sErr();return false;}S.dm-=c;S.sk[k]=l+1;sAch();buzz(15);return true;}
function rowOpen(r){if(r===0)return true;return SK.some(function(s){return s.r===r-1&&sk(s.k)>0;});}
function buyQk(k){var s=QK.filter(function(x){return x.k===k;})[0],l=qk(k);if(!s||l>=s.max)return false;var c=s.c(l);if(S.qf<c){sErr();return false;}S.qf-=c;S.qk[k]=l+1;sAch();buzz(15);return true;}
function resetRun(){
  S.mass=0;S.run=0;S.gens=GENS.map(function(){return 0;});S.tap=0;S.grip=0;buffs=[];combo=0;S.st.runTime=0;
  var h=Math.min(sk('head'),ERAS.length-1);S.era=h;if(h>0){S.run=ERAS[h].at;S.mass=ERAS[h].at*0.2;}
  events=[];fx.clear();
}
function bigCrunch(){
  var g=dmGain();if(g<1)return 0;
  S.dm+=g;S.dmTotal+=g;S.dmMv+=g;S.crunches++;resetRun();
  fx.crunch('BIG CRUNCH','+'+fmt(g)+' Dark Matter');sCrunch();buzz([40,60,80]);save();return g;
}
function multiverse(){
  if(!canMv())return 0;var g=qfGain();
  S.qf+=g;S.qfTotal+=g;S.mvs++;S.dm=qk('seed')?10*Math.pow(4,qk('seed')-1):0;S.dmTotal=S.dm;S.dmMv=0;S.sk={};S.mvMaxEra=0;
  resetRun();fx.crunch('MULTIVERSE','+'+g+' Quantum Foam');sCrunch();buzz([60,80,120]);save();return g;
}
function setEra(e){
  if(e<=S.era)return;S.era=e;if(e>S.maxEra)S.maxEra=e;if(e>S.mvMaxEra)S.mvMaxEra=e;
  fx.eraUp(e);sEra();buzz([30,50,60]);
}
function spawnStar(){events.push({k:'star',x:-30,y:0,vx:0,vy:0,life:9,init:false});}
function spawnNova(){events.push({k:'nova',x:0,y:0,life:16,init:false});}
function catchEvent(e){
  events.splice(events.indexOf(e),1);
  if(e.k==='star'){
    S.st.stars++;var r=Math.random(),lm=1+0.5*sk('luck');
    if(r<0.5){var v=Math.max(gps()*120,tapVal(false)*60,50)*lm;addMass(v);fx.big(e.x,e.y,'LUCKY! +'+fmt(v),'#ffd36b');}
    else if(r<0.85){addBuff('frenzy',30+10*sk('fren'));fx.big(e.x,e.y,'FRENZY ×7!','#ffd36b');}

}

    o3:function(){var w=Math.random()<0.5,v=w?safe*4:safe*0.25;addMass(v);fx.big(W/2,cy,(w?'JACKPOT! +':'Fizzle… +')+fmt(v),w?'#ffd36b':'#aaa');fx.shake(w?18:4);if(w)sCoin();else sErr();}});});
}
function tick(dt){
  T+=dt;S.st.time+=dt;S.st.runTime+=dt;
  addMass(gps()*dt);
  if(T-lastTap>0.6)combo=Math.max(0,combo-(6+combo*0.7)*dt);
  var ar=AUTO[Math.min(6,sk('auto'))];if(ar){autoAcc+=ar*dt;var n=0;while(autoAcc>=1&&n<30){autoAcc--;n++;doTap(undefined,undefined,true);fx.autoTap();}}
  for(var i=buffs.length-1;i>=0;i--){buffs[i].t-=dt;if(buffs[i].t<=0)buffs.splice(i,1);}
  starT-=dt*(1+0.25*sk('mag'));if(starT<=0){starT=55+Math.random()*60;if(!events.some(function(e){return e.k==='star';}))spawnStar();}
  if(S.era>=2){novaT-=dt*(1+0.3*sk('nova'));if(novaT<=0){novaT=240+Math.random()*180;if(!events.some(function(e){return e.k==='nova';}))spawnNova();}}
  var e=eraOf(S.run);if(e>S.era)setEra(e);
  achT-=dt;if(achT<=0){achT=0.5;checkAch();if(!S.crunchNote&&dmGain()>=1){S.crunchNote=1;toast('🌑 Big Crunch unlocked!','Open the Dark Matter tab to prestige');sAch();}}
}
function checkAch(){ACH.forEach(function(a){if(!S.ach[a.id]&&a.f()){S.ach[a.id]=1;toast('🏆 '+a.n,a.d+' · +2% mass forever');sAch();}});}

var cv=$('c'),ctx=cv.getContext('2d'),W=390,H=700,DPR=1,cx=195,cy=300,cyT=300,baseR=40;
var bg=document.createElement('canvas');
var disk=[],objs=[],parts=[],streaks=[],texts=[],rings=[];
var cam=1,camT=0,flash=0,shakeA=0,banner=null,pulse=0,quality=1,frameAvg=16,lowT=0;
var CAP={objs:22,parts:220,streaks:120,disk:170};
function initDisk(){disk=[];var n=Math.floor(CAP.disk*quality);for(var i=0;i<n;i++)disk.push({f:1.3+Math.pow(Math.random(),1.6)*1.9,a:Math.random()*6.283,s:0.6+Math.random()*1.6,t:Math.random()});}
function renderBg(){
  bg.width=Math.round(W*DPR);bg.height=Math.round(H*DPR);var g=bg.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle='#05030c';g.fillRect(0,0,W,H);
  var hue=ERAS[S.era].hue,r=srand(77+S.era*13);
  for(var i=0;i<5;i++){var x=r()*W,y=r()*H,rad=120+r()*220,gr=g.createRadialGradient(x,y,0,x,y,rad);gr.addColorStop(0,'hsla('+(hue+(r()-.5)*80)+',70%,45%,'+(0.10+r()*0.08)+')');gr.addColorStop(1,'hsla('+hue+',70%,30%,0)');g.fillStyle=gr;g.fillRect(0,0,W,H);}
  for(i=0;i<Math.floor(W*H/700);i++){var s=r()*r()*1.8+0.3;g.fillStyle='hsla('+(200+r()*60)+',80%,'+(80+r()*20)+'%,'+(0.3+r()*0.7)+')';g.beginPath();g.arc(r()*W,r()*H,s,0,7);g.fill();}
}
function layout(){
  var hud=$('hud').getBoundingClientRect(),tabs=$('tabs').getBoundingClientRect(),pn=$('panel'),open=pn.classList.contains('open');
  var top=hud.bottom-10,bot=open?H-pn.offsetHeight:tabs.top;
  cyT=(top+bot)/2;baseR=Math.max(26,Math.min(W*0.15,(bot-top)*0.17));
  $('hint').style.top=(bot-(open?34:58))+'px';
}
function resize(){
  W=window.innerWidth;H=window.innerHeight;DPR=Math.min(2.5,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cx=W/2;renderBg();layout();if(!disk.length)initDisk();cy=cyT;
}
function holeR(){return baseR*(0.75+0.5*eraProg())*(1+pulse*0.08);}
function spawnObj(e,offscreen){
  var d=Math.hypot(W,H)/2+40;var o={e:e,r:offscreen===false?baseR*3+Math.random()*d*0.6:d,a:Math.random()*6.283,sz:0,rot:Math.random()*6.28,rv:(Math.random()-.5)*2,seed:Math.floor(Math.random()*1e6),yank:0,sp:0.7+Math.random()*0.6};
  o.sz=(e===0?7:e<=2?9:e<=4?11:e<=7?14:17)*(0.7+Math.random()*0.6);objs.push(o);return o;
}
var fx={
  tap:function(x,y,v,auto){
    var hit=null,i;if(!auto){for(i=0;i<objs.length;i++){var o=objs[i],p=objPos(o);if(Math.hypot(p.x-x,p.y-y)<o.sz*1.6+16&&!o.yank){hit=o;break;}}}
    var n=auto?2:Math.round(5*quality)+2;
    for(var k=0;k<n&&streaks.length<CAP.streaks*quality;k++){var dx=x-cx,dy=(y-cy)/0.6;streaks.push({r:Math.hypot(dx,dy)+(Math.random()-.5)*30,a:Math.atan2(dy,dx)+(Math.random()-.5)*0.4,v:0,h:20+Math.random()*30,l:0});}
    if(!auto){texts.push({x:x+(Math.random()-.5)*20,y:y-20,t:'+'+fmt(v),life:0.9,c:combo>20?'#e0c4ff':'#fff',sz:combo>40?24:20});pulse=Math.min(1,pulse+0.25);sTap();buzz(4);
      if(hit){hit.yank=1;var bv=tapVal(true)*2;addMass(bv);texts.push({x:x,y:y-44,t:'YANK +'+fmt(bv),life:1,c:'#ffd36b',sz:18});}}
  },
  autoTap:function(){if(Math.random()<0.5){var a=Math.random()*6.28,d=baseR*4;fx.tap(cx+Math.cos(a)*d,cy+Math.sin(a)*d*0.6,0,true);}},
  big:function(x,y,t,c){texts.push({x:x,y:y,t:t,life:2,c:c,sz:28,big:1});rings.push({x:x,y:y,r:10,life:0.6,c:c});burst(x,y,c,30,420);},
  shake:function(a){shakeA=Math.max(shakeA,a);},
  eraUp:function(e){cam=1.25/0.75;camT=1;flash=0.9;banner={t:0,e:e};renderBg();shakeA=16;rings.push({x:cx,y:cy,r:baseR,life:1,c:'#fff'});objs.forEach(function(o){o.r*=0.6;});},
  crunch:function(t,s){flash=1;shakeA=24;banner={t:0,title:t,sub:s};camT=1;cam=0.4;renderBg();},
  clear:function(){objs=[];streaks=[];}
};
function burst(x,y,c,n,sp){for(var i=0;i<n&&parts.length<CAP.parts*quality;i++){var a=Math.random()*6.283,v=sp*(0.3+Math.random()*0.7);parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0.5+Math.random()*0.6,c:c,s:1.5+Math.random()*2.5});}}
function objPos(o){return{x:cx+Math.cos(o.a)*o.r,y:cy+Math.sin(o.a)*o.r*0.62};}
var spawnAcc=0,thumpT=0;
function update(dt){
  cy+=(cyT-cy)*Math.min(1,dt*6);
  pulse*=Math.pow(0.02,dt);
  if(camT>0)camT=Math.max(0,camT-dt/1.4);
  var hr=holeR(),i;
  for(i=0;i<disk.length;i++){var d=disk[i];d.a+=dt*1.9*d.s/Math.pow(d.f,1.5);}
  var rate=0.8+Math.min(3,Math.log10(1+gps())*0.5);spawnAcc+=dt*rate;
  while(spawnAcc>=1){spawnAcc--;if(objs.length<CAP.objs*quality){var e=S.era;if(e>0&&Math.random()<0.25)e=e-1;spawnObj(e);}}
  for(i=objs.length-1;i>=0;i--){var o=objs[i];var sp=(18+9000/(o.r+30))*o.sp*(o.yank?7:1);o.r-=sp*dt;o.a+=dt*(o.yank?3:1)*Math.min(4,70/Math.pow(Math.max(o.r,10),0.85))*o.sp;o.rot+=o.rv*dt;
    if(o.r<hr*1.02){var p=objPos(o);objs.splice(i,1);burst(p.x,p.y,eraColor(o.e),Math.round(8*quality),160);pulse=Math.min(1,pulse+0.15);
      if(T-thumpT>0.12){thumpT=T;sThump();}
      if(Math.random()<0.35||o.yank){var v=Math.max(1,gps()/Math.max(0.5,rate));texts.push({x:p.x,y:p.y-14,t:'+'+fmt(v),life:0.8,c:'#ffd9a0',sz:14});}}}
  for(i=streaks.length-1;i>=0;i--){var s=streaks[i];s.v+=(900+6e5/(s.r*s.r+400))*dt;s.r-=s.v*dt;s.a+=dt*Math.min(9,260/Math.max(s.r,20));s.l+=dt;if(s.r<hr||s.l>3)streaks.splice(i,1);}
